name: deploy

# Runs only after `ci` has finished on main, and only if it passed. A push whose
# checks, build or browser tests fail therefore never reaches the live site.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

# One deploy at a time, and never cancel one midway: two quick pushes must not
# race and leave the Worker on the older build.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit ci verified, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build the Worker bundle
        run: npx opennextjs-cloudflare build
        env:
          # Read at build time. `preview` keeps the X-Robots-Tag noindex header on,
          # so the staging URL can never compete with in2itebs.com in search.
          SITE_ENV: preview
          # Baked into canonical URLs, the sitemap and the enquiry origin allow-list.
          # Set the SITE_URL repository variable to the Workers URL after the first deploy.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://in2itebs.com' }}
          # Pages render with the content edits saved in /admin (lib/cms/content.ts reads Supabase).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Admin sign-in (Supabase Auth). Public by design; inlined like every NEXT_PUBLIC_ value.
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      # Deploy before the secrets are uploaded, not after: `wrangler secret put` addresses an
      # existing Worker, and on the very first run there is nothing to attach a secret to yet.
      # Deploying first creates it, so run one and run two behave the same.
      # `opennextjs-cloudflare deploy` first copies the prerendered pages into the R2 page cache
      # (NEXT_INC_CACHE_R2_BUCKET), then runs `wrangler deploy`. The API token therefore needs
      # "Workers R2 Storage: Edit" as well as "Workers Scripts: Edit".
      - name: Deploy to Cloudflare Workers
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Uploaded as Worker secrets, never written into wrangler.jsonc or git: the admin, the chat
      # assistant, the apply form and lead saving read them at runtime. `secret bulk` reads one JSON
      # object from stdin.
      - name: Upload Supabase secrets to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "Supabase secrets are not set; skipping. The site runs without them."
            exit 0
          fi
          # jq builds the JSON so the values are escaped rather than pasted into a string, and
          # neither is echoed.
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_SECRET_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_SECRET_KEY: $key}' \
            | npx wrangler secret bulk
