name: deploy

# Deploys to the Azure VM (57.159.30.28) after `ci` has passed on main. A push whose checks, build or
# browser tests fail never reaches the live site. Can also be started by hand from the Actions tab.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time, never cancelled midway: two quick pushes must not race and leave the VM on
# the older build.
concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit ci verified, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Pack the commit
        run: git archive --format=tar.gz -o site.tar.gz HEAD web supabase

      # The VM_SSH_KEY secret is a private key whose public half is in appuser's authorized_keys on
      # the VM with a forced command: it can only hand over the tarball and run /srv/in2it/deploy.sh
      # (npm ci, next build, pm2 reload). The VM's host key is pinned here so a DNS or IP hijack
      # cannot receive the code.
      - name: Deploy to the Azure VM
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          if [ -z "$VM_SSH_KEY" ]; then
            echo "::error::The VM_SSH_KEY repository secret is not set (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          echo "57.159.30.28 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF3sz0kV0/7Llfmwl+xM+mBErNiXCC0UEVuPA4mPueeb" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 -o StrictHostKeyChecking=yes appuser@57.159.30.28 < site.tar.gz

      - name: Check the live site
        run: |
          sleep 5
          curl -sk --max-time 20 https://57-159-30-28.sslip.io/api/health/ | tee health.json
          grep -q '"status":"ok"' health.json
        continue-on-error: true
