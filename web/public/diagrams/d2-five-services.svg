<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="640" viewBox="0 0 1740 640"><rect width="1740" height="640" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">WHAT WE DO</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">One way in, five services, one accountable team</text><line x1="60" y1="96" x2="1680" y2="96" stroke="#CDC8A5" stroke-width="2"/><rect x="60" y="160" width="300" height="300" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="86" y="214" font-family="Newsreader 16pt" font-size="30" fill="#94B8D0" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">00</text><text x="86" y="252" font-family="IBM Plex Sans" font-size="20" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Discover</text><line x1="86" y1="268" x2="126" y2="268" stroke="#CDC8A5" stroke-width="2"/><text x="86" y="300.0" font-family="IBM Plex Sans" font-size="14" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">A fixed-price estate review. What</text><text x="86" y="321.0" font-family="IBM Plex Sans" font-size="14" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">you have, what it is worth, what</text><text x="86" y="342.0" font-family="IBM Plex Sans" font-size="14" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">to do with each application.</text><text x="86" y="434" font-family="IBM Plex Sans" font-size="11" fill="#94B8D0" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">THE WAY IN</text><line x1="370" y1="310.0" x2="395.0" y2="310.0" stroke="#3F75A3" stroke-width="2.2" stroke-linecap="round"/><polygon points="404.0,310.0 395.0,305.3 395.0,314.7" fill="#3F75A3"/><rect x="416" y="160" width="232" height="300" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.2"/><text x="436" y="214" font-family="Newsreader 16pt" font-size="28" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">01</text><text x="436" y="252" font-family="IBM Plex Sans" font-size="19" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Build</text><line x1="436" y1="268" x2="472" y2="268" stroke="#CDC8A5" stroke-width="2"/><text x="436" y="298.0" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">New web, mobile and</text><text x="436" y="318.25" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">enterprise applications,</text><text x="436" y="338.5" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">designed around the</text><text x="436" y="358.75" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">process rather than the</text><text x="436" y="379.0" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">other way round.</text><line x1="651" y1="310.0" x2="657.0" y2="310.0" stroke="#3F75A3" stroke-width="1.6" stroke-linecap="round"/><polygon points="663.0,310.0 657.0,306.9 657.0,313.1" fill="#3F75A3"/><rect x="666" y="160" width="232" height="300" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.2"/><text x="686" y="214" font-family="Newsreader 16pt" font-size="28" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">02</text><text x="686" y="252" font-family="IBM Plex Sans" font-size="19" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Integrate</text><line x1="686" y1="268" x2="722" y2="268" stroke="#CDC8A5" stroke-width="2"/><text x="686" y="298.0" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">APIs, middleware and SAP</text><text x="686" y="318.25" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">BTP, so a figure is</text><text x="686" y="338.5" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">entered once and</text><text x="686" y="358.75" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">reconciles everywhere it</text><text x="686" y="379.0" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">appears.</text><line x1="901" y1="310.0" x2="907.0" y2="310.0" stroke="#3F75A3" stroke-width="1.6" stroke-linecap="round"/><polygon points="913.0,310.0 907.0,306.9 907.0,313.1" fill="#3F75A3"/><rect x="916" y="160" width="232" height="300" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.2"/><text x="936" y="214" font-family="Newsreader 16pt" font-size="28" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">03</text><text x="936" y="252" font-family="IBM Plex Sans" font-size="19" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Modernise</text><line x1="936" y1="268" x2="972" y2="268" stroke="#CDC8A5" stroke-width="2"/><text x="936" y="298.0" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Retain, rehost,</text><text x="936" y="318.25" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">replatform, refactor,</text><text x="936" y="338.5" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">replace or retire — judged</text><text x="936" y="358.75" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">on business value, not</text><text x="936" y="379.0" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">technology age.</text><line x1="1151" y1="310.0" x2="1157.0" y2="310.0" stroke="#3F75A3" stroke-width="1.6" stroke-linecap="round"/><polygon points="1163.0,310.0 1157.0,306.9 1157.0,313.1" fill="#3F75A3"/><rect x="1166" y="160" width="232" height="300" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.2"/><text x="1186" y="214" font-family="Newsreader 16pt" font-size="28" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">04</text><text x="1186" y="252" font-family="IBM Plex Sans" font-size="19" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Assure</text><line x1="1186" y1="268" x2="1222" y2="268" stroke="#CDC8A5" stroke-width="2"/><text x="1186" y="298.0" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Functional, regression,</text><text x="1186" y="318.25" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">performance and security</text><text x="1186" y="338.5" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">testing, automated where</text><text x="1186" y="358.75" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">that lowers cost and risk.</text><line x1="1401" y1="310.0" x2="1407.0" y2="310.0" stroke="#3F75A3" stroke-width="1.6" stroke-linecap="round"/><polygon points="1413.0,310.0 1407.0,306.9 1407.0,313.1" fill="#3F75A3"/><rect x="1416" y="160" width="232" height="300" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.2"/><text x="1436" y="214" font-family="Newsreader 16pt" font-size="28" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">05</text><text x="1436" y="252" font-family="IBM Plex Sans" font-size="19" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Run</text><line x1="1436" y1="268" x2="1472" y2="268" stroke="#CDC8A5" stroke-width="2"/><text x="1436" y="298.0" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">L1 to L3 against agreed</text><text x="1436" y="318.25" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">service levels, with</text><text x="1436" y="338.5" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">monthly reporting on what</text><text x="1436" y="358.75" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">recurred and what we</text><text x="1436" y="379.0" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">changed.</text><path d="M 532.0 474 L 532.0 518 L 1532.0 518 L 1532.0 474" fill="none" stroke="#94B8D0" stroke-width="2" stroke-dasharray="5 5"/><line x1="534.0" y1="518" x2="532.4" y2="484.0" stroke="#94B8D0" stroke-width="2" stroke-linecap="round"/><polygon points="532.0,476.0 528.2,484.2 536.5,483.8" fill="#94B8D0"/><rect x="782.0" y="501" width="500" height="34" fill="#FFFFFF"/><text x="1032.0" y="523" font-family="IBM Plex Sans" font-size="14.5" fill="#3F75A3" font-weight="600" text-anchor="middle" letter-spacing="0" font-style="normal">What we learn running it goes back into what we build</text></svg>