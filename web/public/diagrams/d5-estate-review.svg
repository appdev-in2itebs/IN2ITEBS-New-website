<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="620" viewBox="0 0 1560 620"><rect width="1560" height="620" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">THE WAY IN</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">The Application Estate Review</text><line x1="60" y1="96" x2="1500" y2="96" stroke="#C1BC9C" stroke-width="2"/><rect x="60" y="152" width="430" height="330" rx="3" fill="#F7F8FA" stroke="#E1E6EE" stroke-width="1.2"/><text x="86" y="200" font-family="IBM Plex Sans" font-size="19" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">What we look at</text><circle cx="90" cy="239" r="3" fill="#3F75A3"/><text x="106" y="244" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Every application in the estate, named</text><text x="106" y="263" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">and owned</text><circle cx="90" cy="295" r="3" fill="#3F75A3"/><text x="106" y="300" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">What each one costs to run and to</text><text x="106" y="319" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">support</text><circle cx="90" cy="351" r="3" fill="#3F75A3"/><text x="106" y="356" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Technical health, supported versions,</text><text x="106" y="375" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">security exposure</text><circle cx="90" cy="407" r="3" fill="#3F75A3"/><text x="106" y="412" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">What it is integrated to, and how</text><circle cx="90" cy="443" r="3" fill="#3F75A3"/><text x="106" y="448" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Who actually uses it, and how often</text><rect x="580.0" y="152" width="400" height="330" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="780.0" y="244" font-family="Newsreader 16pt" font-size="26" fill="#FFFFFF" font-weight="600" text-anchor="middle" letter-spacing="0" font-style="normal">Three to four</text><text x="780.0" y="278" font-family="Newsreader 16pt" font-size="26" fill="#FFFFFF" font-weight="600" text-anchor="middle" letter-spacing="0" font-style="normal">weeks, fixed price</text><line x1="740.0" y1="304" x2="820.0" y2="304" stroke="#C1BC9C" stroke-width="2"/><text x="780.0" y="342" font-family="IBM Plex Sans" font-size="14.5" fill="#A3CBE6" font-weight="400" text-anchor="middle" letter-spacing="0" font-style="normal">No commitment to any of the work</text><text x="780.0" y="364" font-family="IBM Plex Sans" font-size="14.5" fill="#A3CBE6" font-weight="400" text-anchor="middle" letter-spacing="0" font-style="normal">it recommends. The output is yours</text><text x="780.0" y="386" font-family="IBM Plex Sans" font-size="14.5" fill="#A3CBE6" font-weight="400" text-anchor="middle" letter-spacing="0" font-style="normal">either way.</text><rect x="1070.0" y="152" width="430" height="330" rx="3" fill="#FFFFFF" stroke="#121E3B" stroke-width="1.6"/><text x="1096.0" y="200" font-family="IBM Plex Sans" font-size="19" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">What you get</text><circle cx="1100.0" cy="239" r="3" fill="#3F75A3"/><text x="1116.0" y="244" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">A disposition per application: retain,</text><text x="1116.0" y="263" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">rehost, replatform, refactor, replace or</text><text x="1116.0" y="282" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">retire</text><circle cx="1100.0" cy="315" r="3" fill="#3F75A3"/><text x="1116.0" y="320" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">The reasoning behind each one, in</text><text x="1116.0" y="339" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">writing</text><circle cx="1100.0" cy="371" r="3" fill="#3F75A3"/><text x="1116.0" y="376" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">A sequenced roadmap with cost and risk</text><text x="1116.0" y="395" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">attached</text><circle cx="1100.0" cy="427" r="3" fill="#3F75A3"/><text x="1116.0" y="432" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">The list of applications to switch off</text><text x="1116.0" y="451" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">first</text><line x1="496" y1="317.0" x2="566.0" y2="317.0" stroke="#3F75A3" stroke-width="2" stroke-linecap="round"/><polygon points="574.0,317.0 566.0,312.8 566.0,321.2" fill="#3F75A3"/><line x1="986.0" y1="317.0" x2="1056.0" y2="317.0" stroke="#3F75A3" stroke-width="2" stroke-linecap="round"/><polygon points="1064.0,317.0 1056.0,312.8 1056.0,321.2" fill="#3F75A3"/><text x="60" y="586" font-family="IBM Plex Sans" font-size="15" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Two of the four firms we benchmarked lead with an assessment of this kind. We currently offer no way in at all.</text></svg>