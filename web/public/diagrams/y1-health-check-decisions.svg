<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="700" viewBox="0 0 1760 700"><rect width="1760" height="700" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">HEALTH CHECK 360</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Every finding becomes one of six decisions</text><line x1="60" y1="96" x2="1700" y2="96" stroke="#CDC8A5" stroke-width="2"/><rect x="60" y="146" width="532" height="206" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="1.3"/><text x="84" y="190" font-family="Newsreader 16pt" font-size="20" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="1.2" font-style="normal">RETAIN</text><text x="84" y="224.0" font-family="IBM Plex Sans" font-size="12.5" fill="#A3CBE6" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Working, and delivering value</text><text x="84" y="276.0" font-family="IBM Plex Sans" font-size="13" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Protect it. The first job of an assessment</text><text x="84" y="295.5" font-family="IBM Plex Sans" font-size="13" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">is to identify what must not be disturbed.</text><rect x="614" y="146" width="532" height="206" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.3"/><text x="638" y="190" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="1.2" font-style="normal">FIX</text><text x="638" y="224.0" font-family="IBM Plex Sans" font-size="12.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Configured wrongly, or failing</text><text x="638" y="276.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Correct it quickly. These are the findings</text><text x="638" y="295.5" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">that reach payroll and the ones users</text><text x="638" y="315.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">feel.</text><rect x="1168" y="146" width="532" height="206" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.3"/><text x="1192" y="190" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="1.2" font-style="normal">OPTIMISE</text><text x="1192" y="224.0" font-family="IBM Plex Sans" font-size="12.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Works, but more complex than it needs to</text><text x="1192" y="240.875" font-family="IBM Plex Sans" font-size="12.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">be</text><text x="1192" y="276.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Simplify it. Complexity you are</text><text x="1192" y="295.5" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">maintaining for no reason is a cost with</text><text x="1192" y="315.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">no owner.</text><rect x="60" y="374" width="532" height="206" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.3"/><text x="84" y="418" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="1.2" font-style="normal">COMPLETE</text><text x="84" y="452.0" font-family="IBM Plex Sans" font-size="12.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Licensed, partially implemented</text><text x="84" y="504.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Finish it. Capability you have already</text><text x="84" y="523.5" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">paid for and stopped halfway through.</text><rect x="614" y="374" width="532" height="206" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.3"/><text x="638" y="418" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="1.2" font-style="normal">ADOPT</text><text x="638" y="452.0" font-family="IBM Plex Sans" font-size="12.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Built correctly, not being used</text><text x="638" y="504.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Address the process, the interface or the</text><text x="638" y="523.5" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">training — not the configuration.</text><rect x="1168" y="374" width="532" height="206" rx="3" fill="#94B8D0" stroke="#94B8D0" stroke-width="1.3"/><text x="1192" y="418" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="1.2" font-style="normal">RETIRE</text><text x="1192" y="452.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">No longer earning its place</text><text x="1192" y="504.0" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Remove it. Every object kept alive is</text><text x="1192" y="523.5" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">tested, supported and migrated again</text><text x="1192" y="543.0" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">later.</text><rect x="60" y="612" width="1640" height="86" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.4"/><rect x="60" y="612" width="6" height="86" fill="#CDC8A5"/><text x="92" y="648" font-family="Newsreader 16pt" font-size="19" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Retain is a finding too.</text><text x="92" y="678" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">An assessment that returns only problems has not looked properly. Knowing what is working, and why, is what makes the rest of the list safe to act on.</text></svg>