<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="700" viewBox="0 0 1580 700"><rect width="1580" height="700" fill="#FFFFFF"/><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Where application engineering sits</text><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">THE PICTURE</text><line x1="60" y1="96" x2="1520" y2="96" stroke="#C1BC9C" stroke-width="2"/><rect x="60" y="150" width="330" height="380" rx="3" fill="#F7F8FA" stroke="#E1E6EE" stroke-width="1.2"/><text x="86" y="196" font-family="IBM Plex Sans" font-size="18" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Channels and users</text><text x="86" y="224.0" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">The people and systems that touch</text><text x="86" y="243.575" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">the business every day</text><circle cx="90" cy="285" r="3" fill="#3F75A3"/><text x="106" y="290" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Customer and citizen portals</text><circle cx="90" cy="323" r="3" fill="#3F75A3"/><text x="106" y="328" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Mobile apps, iOS and Android</text><circle cx="90" cy="361" r="3" fill="#3F75A3"/><text x="106" y="366" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Dealer, retailer and partner</text><text x="106" y="386" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">portals</text><circle cx="90" cy="421" r="3" fill="#3F75A3"/><text x="106" y="426" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Field and shop-floor users</text><line x1="400" y1="340.0" x2="427.0" y2="340.0" stroke="#3F75A3" stroke-width="2.2" stroke-linecap="round"/><polygon points="436.0,340.0 427.0,335.3 427.0,344.7" fill="#3F75A3"/><line x1="436" y1="366.0" x2="409.0" y2="366.0" stroke="#94B8D0" stroke-width="1.8" stroke-linecap="round"/><polygon points="400.0,366.0 409.0,370.7 409.0,361.3" fill="#94B8D0"/><rect x="446" y="150" width="330" height="380" rx="3" fill="#F7F8FA" stroke="#E1E6EE" stroke-width="1.2"/><text x="472" y="196" font-family="IBM Plex Sans" font-size="18" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Applications we build and run</text><text x="472" y="224.0" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">The layer that carries the process</text><text x="472" y="243.575" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">the ERP does not</text><circle cx="476" cy="285" r="3" fill="#3F75A3"/><text x="492" y="290" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Custom web and enterprise</text><text x="492" y="310" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">apps</text><circle cx="476" cy="345" r="3" fill="#3F75A3"/><text x="492" y="350" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Workflow and approval</text><text x="492" y="370" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">platforms</text><circle cx="476" cy="405" r="3" fill="#3F75A3"/><text x="492" y="410" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Line-of-business applications</text><circle cx="476" cy="443" r="3" fill="#3F75A3"/><text x="492" y="448" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Legacy systems still in</text><text x="492" y="468" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">service</text><line x1="786" y1="340.0" x2="813.0" y2="340.0" stroke="#3F75A3" stroke-width="2.2" stroke-linecap="round"/><polygon points="822.0,340.0 813.0,335.3 813.0,344.7" fill="#3F75A3"/><line x1="822" y1="366.0" x2="795.0" y2="366.0" stroke="#94B8D0" stroke-width="1.8" stroke-linecap="round"/><polygon points="786.0,366.0 795.0,370.7 795.0,361.3" fill="#94B8D0"/><rect x="832" y="150" width="330" height="380" rx="3" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.2"/><rect x="832" y="150" width="6" height="380" fill="#3F75A3"/><text x="858" y="196" font-family="IBM Plex Sans" font-size="18" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">The integration spine</text><text x="858" y="224.0" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Governed, two-way, documented</text><circle cx="862" cy="285" r="3" fill="#3F75A3"/><text x="878" y="290" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">APIs and middleware</text><circle cx="862" cy="323" r="3" fill="#3F75A3"/><text x="878" y="328" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">SAP BTP</text><circle cx="862" cy="361" r="3" fill="#3F75A3"/><text x="878" y="366" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Event and batch interfaces</text><circle cx="862" cy="399" r="3" fill="#3F75A3"/><text x="878" y="404" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Master-data alignment</text><line x1="1172" y1="340.0" x2="1199.0" y2="340.0" stroke="#3F75A3" stroke-width="2.2" stroke-linecap="round"/><polygon points="1208.0,340.0 1199.0,335.3 1199.0,344.7" fill="#3F75A3"/><line x1="1208" y1="366.0" x2="1181.0" y2="366.0" stroke="#94B8D0" stroke-width="1.8" stroke-linecap="round"/><polygon points="1172.0,366.0 1181.0,370.7 1181.0,361.3" fill="#94B8D0"/><rect x="1218" y="150" width="330" height="380" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="1244" y="196" font-family="IBM Plex Sans" font-size="18" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">The system of record</text><text x="1244" y="224.0" font-family="IBM Plex Sans" font-size="13.5" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Where the transaction finally</text><text x="1244" y="243.575" font-family="IBM Plex Sans" font-size="13.5" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">lands</text><circle cx="1248" cy="285" r="3" fill="#94B8D0"/><text x="1264" y="290" font-family="IBM Plex Sans" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">SAP S/4HANA</text><circle cx="1248" cy="323" r="3" fill="#94B8D0"/><text x="1264" y="328" font-family="IBM Plex Sans" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">SAP SuccessFactors</text><circle cx="1248" cy="361" r="3" fill="#94B8D0"/><text x="1264" y="366" font-family="IBM Plex Sans" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">or another ERP of record</text><line x1="60" y1="568" x2="1520" y2="568" stroke="#E1E6EE" stroke-width="1.2"/><text x="60" y="602" font-family="Newsreader 16pt" font-size="22" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Everything has to agree with the ledger.</text><text x="60" y="632" font-family="IBM Plex Sans" font-size="15" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">We build and run the applications on the left, and we are accountable for the fact that what they record still reconciles with what sits on the right.</text></svg>