<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" fill="#FFFFFF"/><rect x="0" y="0" width="1200" height="640" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.4"/><rect x="0" y="0" width="1200" height="74" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="30" y="34" font-family="IBM Plex Sans" font-size="12" fill="#94B8D0" font-weight="600" text-anchor="start" letter-spacing="1.6" font-style="normal">REPORT SECTION 06 / 07</text><text x="30" y="56" font-family="Newsreader 16pt" font-size="21" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Data volume and archiving</text><text x="1170" y="46" font-family="IBM Plex Sans" font-size="12" fill="#A3CBE6" font-weight="400" text-anchor="end" letter-spacing="0" font-style="normal">ECC Prism sample output</text><text x="30" y="118" font-family="IBM Plex Sans" font-size="10.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.7" font-style="normal">DATABASE GROWTH, INDEXED — THREE YEARS</text><line x1="60" y1="490" x2="720" y2="490" stroke="#E1E1E1" stroke-width="1"/><text x="48" y="495.0" font-family="IBM Plex Sans" font-size="11" fill="#5A6478" font-weight="400" text-anchor="end" letter-spacing="0" font-style="normal">100</text><line x1="60" y1="424" x2="720" y2="424" stroke="#E1E1E1" stroke-width="1"/><text x="48" y="429.0" font-family="IBM Plex Sans" font-size="11" fill="#5A6478" font-weight="400" text-anchor="end" letter-spacing="0" font-style="normal">110</text><line x1="60" y1="358" x2="720" y2="358" stroke="#E1E1E1" stroke-width="1"/><text x="48" y="363.0" font-family="IBM Plex Sans" font-size="11" fill="#5A6478" font-weight="400" text-anchor="end" letter-spacing="0" font-style="normal">120</text><line x1="60" y1="292" x2="720" y2="292" stroke="#E1E1E1" stroke-width="1"/><text x="48" y="297.0" font-family="IBM Plex Sans" font-size="11" fill="#5A6478" font-weight="400" text-anchor="end" letter-spacing="0" font-style="normal">130</text><line x1="60" y1="226" x2="720" y2="226" stroke="#E1E1E1" stroke-width="1"/><text x="48" y="231.0" font-family="IBM Plex Sans" font-size="11" fill="#5A6478" font-weight="400" text-anchor="end" letter-spacing="0" font-style="normal">140</text><line x1="60" y1="160" x2="720" y2="160" stroke="#E1E1E1" stroke-width="1"/><text x="48" y="165.0" font-family="IBM Plex Sans" font-size="11" fill="#5A6478" font-weight="400" text-anchor="end" letter-spacing="0" font-style="normal">150</text><text x="60.0" y="516" font-family="IBM Plex Sans" font-size="11" fill="#5A6478" font-weight="400" text-anchor="middle" letter-spacing="0" font-style="normal">Year 0</text><text x="280.0" y="516" font-family="IBM Plex Sans" font-size="11" fill="#5A6478" font-weight="400" text-anchor="middle" letter-spacing="0" font-style="normal">Year 1</text><text x="500.0" y="516" font-family="IBM Plex Sans" font-size="11" fill="#5A6478" font-weight="400" text-anchor="middle" letter-spacing="0" font-style="normal">Year 2</text><text x="720.0" y="516" font-family="IBM Plex Sans" font-size="11" fill="#5A6478" font-weight="400" text-anchor="middle" letter-spacing="0" font-style="normal">Year 3</text><path d="M 60.0,490.0 L 280.0,397.6 L 500.0,292.0 L 720.0,173.2" fill="none" stroke="#3F75A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60.0" cy="490.0" r="5" fill="#3F75A3"/><circle cx="280.0" cy="397.6" r="5" fill="#3F75A3"/><circle cx="500.0" cy="292.0" r="5" fill="#3F75A3"/><circle cx="720.0" cy="173.2" r="5" fill="#3F75A3"/><path d="M 60.0,490.0 L 280.0,457.0 L 500.0,437.2 L 720.0,424.0" fill="none" stroke="#121E3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60.0" cy="490.0" r="5" fill="#121E3B"/><circle cx="280.0" cy="457.0" r="5" fill="#121E3B"/><circle cx="500.0" cy="437.2" r="5" fill="#121E3B"/><circle cx="720.0" cy="424.0" r="5" fill="#121E3B"/><text x="710.0" y="159.20000000000005" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="end" letter-spacing="0" font-style="normal">Unarchived</text><text x="710.0" y="448.0" font-family="IBM Plex Sans" font-size="12" fill="#121E3B" font-weight="600" text-anchor="end" letter-spacing="0" font-style="normal">With a phased archiving plan</text><text x="30" y="510" font-family="IBM Plex Sans" font-size="1" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal"></text><text x="770" y="118" font-family="IBM Plex Sans" font-size="10.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.7" font-style="normal">WHAT THE PASS FOUND</text><circle cx="782" cy="161" r="4.5" fill="#94B8D0"/><text x="802" y="166.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Database growing at roughly 14% a</text><text x="802" y="182.875" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">year</text><circle cx="782" cy="201" r="4.5" fill="#94B8D0"/><text x="802" y="206.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">High-volume tables concentrated in</text><text x="802" y="222.875" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">FI, MM and PM</text><circle cx="782" cy="241" r="4.5" fill="#94B8D0"/><text x="802" y="246.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Duplicate master records across</text><text x="802" y="262.875" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">several objects</text><circle cx="782" cy="281" r="4.5" fill="#94B8D0"/><text x="802" y="286.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">No archiving run in six years</text><text x="770" y="330" font-family="IBM Plex Sans" font-size="10.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.7" font-style="normal">WHAT THE REPORT RECOMMENDS</text><circle cx="782" cy="373" r="4.5" fill="#3F75A3"/><text x="802" y="378.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Archive low-risk historical data</text><text x="802" y="394.875" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">first</text><circle cx="782" cy="415" r="4.5" fill="#3F75A3"/><text x="802" y="420.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">A phased roadmap, module by module</text><circle cx="782" cy="457" r="4.5" fill="#3F75A3"/><text x="802" y="462.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">A master data cleansing and</text><text x="802" y="478.875" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">governance framework</text><rect x="770" y="498" width="400" height="86" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="794" y="532" font-family="Newsreader 16pt" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Why it is never technical</text><text x="794" y="558.0" font-family="IBM Plex Sans" font-size="12" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">The constraint is proving an auditor can</text><text x="794" y="573.6" font-family="IBM Plex Sans" font-size="12" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">still reach the record.</text><line x1="30" y1="594" x2="1170" y2="594" stroke="#CDC8A5" stroke-width="1.3"/><text x="30" y="614" font-family="IBM Plex Sans" font-size="11" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Illustrative curve from a sample report. The growth rate, the tables and the archivable objects are measured in your own system.</text></svg>