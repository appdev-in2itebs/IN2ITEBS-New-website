<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" fill="#FFFFFF"/><rect x="0" y="0" width="1200" height="640" rx="3" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.4"/><rect x="0" y="0" width="1200" height="74" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="30" y="34" font-family="IBM Plex Sans" font-size="12" fill="#94B8D0" font-weight="600" text-anchor="start" letter-spacing="1.6" font-style="normal">REPORT SECTION 04</text><text x="30" y="56" font-family="Newsreader 16pt" font-size="21" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Custom code and RICEFW</text><text x="1170" y="46" font-family="IBM Plex Sans" font-size="12" fill="#A3CBE6" font-weight="400" text-anchor="end" letter-spacing="0" font-style="normal">ECC Prism sample output</text><text x="30" y="118" font-family="IBM Plex Sans" font-size="10.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.7" font-style="normal">WHAT THE PASS FOUND</text><rect x="30" y="150" width="548" height="74" rx="3" fill="#F7F8FA" stroke="#E1E6EE" stroke-width="1.2"/><text x="48" y="196" font-family="Newsreader 16pt" font-size="22" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">1,420</text><text x="176" y="180.0" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">custom objects inventoried across the</text><text x="176" y="196.875" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">estate</text><rect x="30" y="234" width="548" height="74" rx="3" fill="#F7F8FA" stroke="#E1E6EE" stroke-width="1.2"/><text x="48" y="280" font-family="Newsreader 16pt" font-size="22" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">18%</text><text x="176" y="264.0" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">of RICEFW objects not executed in</text><text x="176" y="280.875" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">twenty-four months</text><rect x="30" y="318" width="548" height="74" rx="3" fill="#F7F8FA" stroke="#E1E6EE" stroke-width="1.2"/><text x="48" y="364" font-family="Newsreader 16pt" font-size="22" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">14</text><text x="176" y="348.0" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">high-volume reports consuming most of</text><text x="176" y="364.875" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">the batch window</text><rect x="30" y="402" width="548" height="74" rx="3" fill="#F7F8FA" stroke="#E1E6EE" stroke-width="1.2"/><text x="48" y="448" font-family="Newsreader 16pt" font-size="22" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Several</text><text x="176" y="432.0" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">custom reports duplicating standard</text><text x="176" y="448.875" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">SAP functionality</text><text x="618" y="118" font-family="IBM Plex Sans" font-size="10.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.7" font-style="normal">HOW THE CODE CLASSIFIES</text><rect x="618" y="156" width="304" height="62" fill="#121E3B"/><text x="630" y="194" font-family="Newsreader 16pt" font-size="17" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">55%</text><rect x="922" y="156" width="166" height="62" fill="#94B8D0"/><text x="933.6" y="194" font-family="Newsreader 16pt" font-size="17" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">30%</text><rect x="1087" y="156" width="83" height="62" fill="#A3CBE6"/><text x="1099.2" y="194" font-family="Newsreader 16pt" font-size="17" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">15%</text><rect x="618" y="240" width="13" height="13" fill="#121E3B"/><text x="642" y="251" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Reusable without change — 55%</text><rect x="618" y="266" width="13" height="13" fill="#94B8D0"/><text x="642" y="277" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Minor modification — 30%</text><rect x="618" y="292" width="13" height="13" fill="#A3CBE6"/><text x="642" y="303" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Redesign or retire — 15%</text><text x="618" y="336" font-family="IBM Plex Sans" font-size="10.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.7" font-style="normal">WHAT THE REPORT RECOMMENDS</text><circle cx="632" cy="375" r="4.5" fill="#3F75A3"/><text x="652" y="380.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Retire the objects nothing has executed</text><circle cx="632" cy="411" r="4.5" fill="#3F75A3"/><text x="652" y="416.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Consolidate redundant custom reports</text><circle cx="632" cy="447" r="4.5" fill="#3F75A3"/><text x="652" y="452.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Redesign the long-running batch programs</text><circle cx="632" cy="483" r="4.5" fill="#3F75A3"/><text x="652" y="488.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Separate genuinely required new build from avoidable</text><text x="652" y="504.875" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">customisation</text><rect x="30" y="498" width="548" height="86" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="54" y="532" font-family="Newsreader 16pt" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">The cheapest work in the estate</text><text x="54" y="560" font-family="IBM Plex Sans" font-size="12.5" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Code nobody runs still costs to maintain, to test, and again at migration.</text><line x1="30" y1="594" x2="1170" y2="594" stroke="#C1BC9C" stroke-width="1.3"/><text x="30" y="614" font-family="IBM Plex Sans" font-size="11" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Illustrative figures from a sample report. The classification split is produced per object, not estimated.</text></svg>