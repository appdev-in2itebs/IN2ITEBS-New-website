<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="824" viewBox="0 0 1760 824"><rect width="1760" height="824" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">HOW THIS SITE WORKS</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">How a claim gets onto this site — and how it leaves</text><line x1="60" y1="96" x2="1700" y2="96" stroke="#CDC8A5" stroke-width="2"/><text x="60" y="126" font-family="IBM Plex Sans" font-size="14.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Four checks run on every build. Any one of them failing stops the whole site publishing, not just the line that failed.</text><rect x="60" y="176" width="390" height="230" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.2"/><rect x="60" y="176" width="390" height="52" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="78" y="210" font-family="Newsreader 16pt" font-size="15" fill="#CDC8A5" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">01</text><text x="114" y="210" font-family="IBM Plex Sans" font-size="11.5" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">EVIDENCE</text><text x="78" y="260.0" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">A purchase order, a statement of work,</text><text x="78" y="278.46" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">a measurement taken from the system,</text><text x="78" y="296.92" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">or SAP's own partner profile.</text><line x1="78" y1="360" x2="432" y2="360" stroke="#CDC8A5" stroke-width="1.3"/><text x="78" y="382.0" font-family="IBM Plex Sans" font-size="11.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Never another case study, and never a</text><text x="78" y="397.525" font-family="IBM Plex Sans" font-size="11.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">deck.</text><line x1="453" y1="202" x2="466.0" y2="202.0" stroke="#3F75A3" stroke-width="2.2" stroke-linecap="round"/><polygon points="473.0,202.0 466.0,198.4 466.0,205.6" fill="#3F75A3"/><rect x="476" y="176" width="390" height="230" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.2"/><rect x="476" y="176" width="390" height="52" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="494" y="210" font-family="Newsreader 16pt" font-size="15" fill="#CDC8A5" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">02</text><text x="530" y="210" font-family="IBM Plex Sans" font-size="11.5" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">RECORDED</text><text x="494" y="260.0" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Written into a content file with the</text><text x="494" y="278.46" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">date a person last checked it, and —</text><text x="494" y="296.92" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">for a figure — what it is a number of,</text><text x="494" y="315.38" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">the window and who measured it.</text><line x1="494" y1="360" x2="848" y2="360" stroke="#CDC8A5" stroke-width="1.3"/><text x="494" y="382.0" font-family="IBM Plex Sans" font-size="11.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">The record carries the provenance, not</text><text x="494" y="397.525" font-family="IBM Plex Sans" font-size="11.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">the prose.</text><line x1="869" y1="202" x2="882.0" y2="202.0" stroke="#3F75A3" stroke-width="2.2" stroke-linecap="round"/><polygon points="889.0,202.0 882.0,198.4 882.0,205.6" fill="#3F75A3"/><rect x="892" y="176" width="390" height="230" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.2"/><rect x="892" y="176" width="390" height="52" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="910" y="210" font-family="Newsreader 16pt" font-size="15" fill="#CDC8A5" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">03</text><text x="946" y="210" font-family="IBM Plex Sans" font-size="11.5" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">PUBLISHED</text><text x="910" y="260.0" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">The claim appears with its review date</text><text x="910" y="278.46" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">beside it, and the date it stops</text><text x="910" y="296.92" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">publishing.</text><line x1="910" y1="360" x2="1264" y2="360" stroke="#CDC8A5" stroke-width="1.3"/><text x="910" y="382.0" font-family="IBM Plex Sans" font-size="11.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Two fixed dates. Never “verified</text><text x="910" y="397.525" font-family="IBM Plex Sans" font-size="11.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">recently”.</text><line x1="1285" y1="202" x2="1298.0" y2="202.0" stroke="#3F75A3" stroke-width="2.2" stroke-linecap="round"/><polygon points="1305.0,202.0 1298.0,198.4 1298.0,205.6" fill="#3F75A3"/><rect x="1308" y="176" width="390" height="230" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.2"/><rect x="1308" y="176" width="390" height="52" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="1326" y="210" font-family="Newsreader 16pt" font-size="15" fill="#CDC8A5" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">04</text><text x="1362" y="210" font-family="IBM Plex Sans" font-size="11.5" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">EXPIRES</text><text x="1326" y="260.0" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">A person re-checks it against the</text><text x="1326" y="278.46" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">evidence, or it comes off the site.</text><line x1="1326" y1="360" x2="1680" y2="360" stroke="#CDC8A5" stroke-width="1.3"/><text x="1326" y="382.0" font-family="IBM Plex Sans" font-size="11.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Editing the date without doing the check</text><text x="1326" y="397.525" font-family="IBM Plex Sans" font-size="11.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">is the one failure this cannot catch.</text><text x="60" y="444" font-family="IBM Plex Sans" font-size="11.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">EVERY BUILD RUNS THESE FOUR</text><rect x="60" y="462" width="390" height="118" rx="3" fill="#FFFFFF" stroke="#3F75A3" stroke-width="1.6"/><rect x="60" y="462" width="5" height="118" fill="#3F75A3"/><text x="80" y="494" font-family="Newsreader 16pt" font-size="15" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">The capability register</text><text x="80" y="518.0" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Stops if nobody has re-checked it in</text><text x="80" y="535.25" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">90 days</text><text x="80" y="564" font-family="IBM Plex Sans" font-size="10.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">content/capability-status.ts</text><rect x="476" y="462" width="390" height="118" rx="3" fill="#FFFFFF" stroke="#3F75A3" stroke-width="1.6"/><rect x="476" y="462" width="5" height="118" fill="#3F75A3"/><text x="496" y="494" font-family="Newsreader 16pt" font-size="15" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">The corporate facts</text><text x="496" y="518.0" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Stops if nobody has re-checked them</text><text x="496" y="535.25" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">in 200 days</text><text x="496" y="564" font-family="IBM Plex Sans" font-size="10.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">content/site.ts</text><rect x="892" y="462" width="390" height="118" rx="3" fill="#FFFFFF" stroke="#3F75A3" stroke-width="1.6"/><rect x="892" y="462" width="5" height="118" fill="#3F75A3"/><text x="912" y="494" font-family="Newsreader 16pt" font-size="15" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">The house style</text><text x="912" y="518.0" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Stops on an adjective with no</text><text x="912" y="535.25" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">possible test</text><text x="912" y="564" font-family="IBM Plex Sans" font-size="10.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">scripts/house-style.mjs</text><rect x="1308" y="462" width="390" height="118" rx="3" fill="#FFFFFF" stroke="#3F75A3" stroke-width="1.6"/><rect x="1308" y="462" width="5" height="118" fill="#3F75A3"/><text x="1328" y="494" font-family="Newsreader 16pt" font-size="15" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Outcome figures</text><text x="1328" y="518.0" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Stops on a percentage with no</text><text x="1328" y="535.25" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">recorded baseline</text><text x="1328" y="564" font-family="IBM Plex Sans" font-size="10.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">scripts/figures.mjs</text><rect x="60" y="628" width="1640" height="104" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><rect x="60" y="628" width="6" height="104" fill="#CDC8A5"/><text x="94" y="668" font-family="Newsreader 16pt" font-size="21" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">If any one of them fails, nothing publishes.</text><text x="94" y="700" font-family="IBM Plex Sans" font-size="14" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Not a warning in a backlog and not a flag on the offending line — the build stops, and the whole site stays on its previous version until a person fixes it.</text><text x="60" y="778" font-family="IBM Plex Sans" font-size="11.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">AND THEN IT STARTS AGAIN</text><text x="330" y="778" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Every claim on this site is provisional. The only question is whether the date on it is still good.</text></svg>