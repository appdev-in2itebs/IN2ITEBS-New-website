<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="640" viewBox="0 0 1420 640"><rect width="1420" height="640" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">HOW SUPPORT WORKS</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Who picks it up, and what happens next</text><line x1="60" y1="96" x2="1360" y2="96" stroke="#C1BC9C" stroke-width="2"/><rect x="60" y="150" width="400" height="250" rx="3" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.2"/><rect x="60" y="150" width="400" height="7" fill="#A3CBE6"/><text x="86" y="212" font-family="Newsreader 16pt" font-size="28" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">L1</text><text x="138" y="212" font-family="IBM Plex Sans" font-size="18" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Service desk</text><text x="86" y="254.0" font-family="IBM Plex Sans" font-size="14.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Logged, triaged and acknowledged. Known</text><text x="86" y="275.75" font-family="IBM Plex Sans" font-size="14.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">issues resolved from the runbook.</text><line x1="466" y1="275.0" x2="479.0" y2="275.0" stroke="#3F75A3" stroke-width="1.8" stroke-linecap="round"/><polygon points="486.0,275.0 479.0,271.4 479.0,278.6" fill="#3F75A3"/><rect x="492" y="150" width="400" height="250" rx="3" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.2"/><rect x="492" y="150" width="400" height="7" fill="#94B8D0"/><text x="518" y="212" font-family="Newsreader 16pt" font-size="28" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">L2</text><text x="570" y="212" font-family="IBM Plex Sans" font-size="18" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Application support</text><text x="518" y="254.0" font-family="IBM Plex Sans" font-size="14.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Configuration, data fixes and recurring</text><text x="518" y="275.75" font-family="IBM Plex Sans" font-size="14.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">faults. Root cause recorded, not just the</text><text x="518" y="297.5" font-family="IBM Plex Sans" font-size="14.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">symptom.</text><line x1="898" y1="275.0" x2="911.0" y2="275.0" stroke="#3F75A3" stroke-width="1.8" stroke-linecap="round"/><polygon points="918.0,275.0 911.0,271.4 911.0,278.6" fill="#3F75A3"/><rect x="924" y="150" width="400" height="250" rx="3" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.2"/><rect x="924" y="150" width="400" height="7" fill="#3F75A3"/><text x="950" y="212" font-family="Newsreader 16pt" font-size="28" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">L3</text><text x="1002" y="212" font-family="IBM Plex Sans" font-size="18" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Engineering</text><text x="950" y="254.0" font-family="IBM Plex Sans" font-size="14.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Code defects, enhancements and the changes</text><text x="950" y="275.75" font-family="IBM Plex Sans" font-size="14.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">that stop the ticket coming back.</text><rect x="60" y="470" width="1300" height="120" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="92" y="516" font-family="Newsreader 16pt" font-size="20" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Every month, in writing</text><text x="92" y="550" font-family="IBM Plex Sans" font-size="14.5" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Tickets raised and closed  ·  response and resolution against the agreed levels  ·  what recurred  ·  what we changed so it would not recur  ·  what we recommend next</text></svg>