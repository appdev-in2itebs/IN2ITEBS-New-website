<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790"><rect width="1240" height="790" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">HOW WE DECIDE</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">What to modernise, and what to leave alone</text><line x1="60" y1="96" x2="1180" y2="96" stroke="#C1BC9C" stroke-width="2"/><rect x="180" y="150" width="900" height="460" rx="3" fill="#F7F8FA" stroke="#E1E6EE" stroke-width="1.2"/><line x1="630.0" y1="150" x2="630.0" y2="610" stroke="#E1E6EE" stroke-width="1.2"/><line x1="180" y1="380.0" x2="1080" y2="380.0" stroke="#E1E6EE" stroke-width="1.2"/><rect x="200.0" y="170.0" width="410.0" height="190.0" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="226.0" y="222.0" font-family="Newsreader 16pt" font-size="24" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Refactor</text><line x1="226.0" y1="238.0" x2="266.0" y2="238.0" stroke="#94B8D0" stroke-width="2"/><text x="226.0" y="270.0" font-family="IBM Plex Sans" font-size="14" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">High value, and worth the effort.</text><text x="226.0" y="291.0" font-family="IBM Plex Sans" font-size="14" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Rebuild the parts that carry the</text><text x="226.0" y="312.0" font-family="IBM Plex Sans" font-size="14" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">business, usually cloud-native and</text><text x="226.0" y="333.0" font-family="IBM Plex Sans" font-size="14" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">API-first.</text><rect x="650.0" y="170.0" width="410.0" height="190.0" rx="3" fill="#94B8D0" stroke="#E1E6EE" stroke-width="1.2"/><text x="676.0" y="222.0" font-family="Newsreader 16pt" font-size="24" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Re-platform</text><line x1="676.0" y1="238.0" x2="716.0" y2="238.0" stroke="#C1BC9C" stroke-width="2"/><text x="676.0" y="270.0" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Valuable, but the logic is sound. Move</text><text x="676.0" y="291.0" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">it to a supported, cloud-ready</text><text x="676.0" y="312.0" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">platform without rewriting it.</text><rect x="200.0" y="400.0" width="410.0" height="190.0" rx="3" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.2"/><text x="226.0" y="452.0" font-family="Newsreader 16pt" font-size="24" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Re-host</text><line x1="226.0" y1="468.0" x2="266.0" y2="468.0" stroke="#C1BC9C" stroke-width="2"/><text x="226.0" y="500.0" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Keep it running at lower cost and</text><text x="226.0" y="521.0" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">lower risk. Lift it, shift it, leave</text><text x="226.0" y="542.0" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">the code alone.</text><rect x="650.0" y="400.0" width="410.0" height="190.0" rx="3" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.2"/><text x="676.0" y="452.0" font-family="Newsreader 16pt" font-size="24" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Retire</text><line x1="676.0" y1="468.0" x2="716.0" y2="468.0" stroke="#C1BC9C" stroke-width="2"/><text x="676.0" y="500.0" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Low value, duplicated elsewhere, or</text><text x="676.0" y="521.0" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">nobody has opened it in a year. The</text><text x="676.0" y="542.0" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">cheapest modernisation there is.</text><g transform="rotate(-90 70 380.0)"><text x="70" y="380.0" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="middle" letter-spacing="1.9" font-style="normal">VALUE TO THE BUSINESS</text></g><line x1="104" y1="600" x2="104.0" y2="168.0" stroke="#94B8D0" stroke-width="1.6" stroke-linecap="round"/><polygon points="104.0,160.0 99.8,168.0 108.2,168.0" fill="#94B8D0"/><text x="630.0" y="656" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="middle" letter-spacing="1.9" font-style="normal">COST AND RISK TO CHANGE</text><line x1="190" y1="676" x2="1062.0" y2="676.0" stroke="#94B8D0" stroke-width="1.6" stroke-linecap="round"/><polygon points="1070.0,676.0 1062.0,671.8 1062.0,680.2" fill="#94B8D0"/><text x="60" y="756" font-family="IBM Plex Sans" font-size="15" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">We publish the recommendation per application, including the ones where the answer is to do nothing.</text></svg>