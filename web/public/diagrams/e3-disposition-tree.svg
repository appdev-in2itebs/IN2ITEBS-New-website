<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="760" viewBox="0 0 1620 760"><rect width="1620" height="760" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">HOW THE CALL IS MADE</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Four questions, six answers</text><line x1="60" y1="96" x2="1560" y2="96" stroke="#CDC8A5" stroke-width="2"/><rect x="70" y="165" width="330" height="78" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.2"/><rect x="70" y="165" width="5" height="78" fill="#3F75A3"/><text x="94" y="197" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Has anyone opened it in ninety</text><text x="94" y="218" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">days?</text><line x1="408" y1="204.0" x2="512.0" y2="204.0" stroke="#121E3B" stroke-width="1.8" stroke-linecap="round"/><polygon points="520.0,204.0 512.0,199.8 512.0,208.2" fill="#121E3B"/><text x="422" y="194.0" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">No</text><rect x="532" y="178.0" width="236" height="52" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="650" y="210.0" font-family="IBM Plex Sans" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle" letter-spacing="0" font-style="normal">RETIRE</text><path d="M 235.0 243 L 235.0 285" stroke="#94B8D0" stroke-width="2"/><line x1="235.0" y1="271" x2="235.0" y2="276.0" stroke="#94B8D0" stroke-width="2" stroke-linecap="round"/><polygon points="235.0,283.0 238.6,276.0 231.4,276.0" fill="#94B8D0"/><text x="247.0" y="269" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Yes</text><rect x="70" y="285" width="330" height="78" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.2"/><rect x="70" y="285" width="5" height="78" fill="#3F75A3"/><text x="94" y="317" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Does it still match how the</text><text x="94" y="338" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">business works?</text><line x1="408" y1="324.0" x2="512.0" y2="324.0" stroke="#121E3B" stroke-width="1.8" stroke-linecap="round"/><polygon points="520.0,324.0 512.0,319.8 512.0,328.2" fill="#121E3B"/><text x="422" y="314.0" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">No</text><rect x="532" y="298.0" width="236" height="52" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.4"/><text x="650" y="330.0" font-family="IBM Plex Sans" font-size="16" fill="#121E3B" font-weight="600" text-anchor="middle" letter-spacing="0" font-style="normal">REPLACE</text><path d="M 235.0 363 L 235.0 405" stroke="#94B8D0" stroke-width="2"/><line x1="235.0" y1="391" x2="235.0" y2="396.0" stroke="#94B8D0" stroke-width="2" stroke-linecap="round"/><polygon points="235.0,403.0 238.6,396.0 231.4,396.0" fill="#94B8D0"/><text x="247.0" y="389" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Yes</text><rect x="70" y="405" width="330" height="78" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.2"/><rect x="70" y="405" width="5" height="78" fill="#3F75A3"/><text x="94" y="437" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Is the platform still supported?</text><line x1="408" y1="444.0" x2="512.0" y2="444.0" stroke="#121E3B" stroke-width="1.8" stroke-linecap="round"/><polygon points="520.0,444.0 512.0,439.8 512.0,448.2" fill="#121E3B"/><text x="422" y="434.0" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">No</text><rect x="532" y="396.0" width="236" height="96" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.4"/><line x1="532" y1="444.0" x2="768" y2="444.0" stroke="#E1E1E1" stroke-width="1.2"/><text x="552" y="420.0" font-family="IBM Plex Sans" font-size="15" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">REPLATFORM</text><text x="552" y="438.0" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">the code moves with it</text><text x="552" y="470.0" font-family="IBM Plex Sans" font-size="15" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">REHOST</text><text x="552" y="488.0" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">a cheaper home, no code change</text><path d="M 235.0 483 L 235.0 525" stroke="#94B8D0" stroke-width="2"/><line x1="235.0" y1="511" x2="235.0" y2="516.0" stroke="#94B8D0" stroke-width="2" stroke-linecap="round"/><polygon points="235.0,523.0 238.6,516.0 231.4,516.0" fill="#94B8D0"/><text x="247.0" y="509" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Yes</text><rect x="70" y="525" width="330" height="78" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.2"/><rect x="70" y="525" width="5" height="78" fill="#3F75A3"/><text x="94" y="557" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Is it on the critical path?</text><line x1="408" y1="564.0" x2="512.0" y2="564.0" stroke="#121E3B" stroke-width="1.8" stroke-linecap="round"/><polygon points="520.0,564.0 512.0,559.8 512.0,568.2" fill="#121E3B"/><text x="422" y="554.0" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">No</text><rect x="532" y="538.0" width="236" height="52" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.4"/><text x="650" y="570.0" font-family="IBM Plex Sans" font-size="16" fill="#121E3B" font-weight="600" text-anchor="middle" letter-spacing="0" font-style="normal">RETAIN</text><line x1="235.0" y1="609" x2="235.0" y2="647.0" stroke="#94B8D0" stroke-width="2" stroke-linecap="round"/><polygon points="235.0,655.0 239.2,647.0 230.8,647.0" fill="#94B8D0"/><text x="247.0" y="639" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Yes</text><rect x="137.0" y="661" width="196" height="52" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="235.0" y="693" font-family="IBM Plex Sans" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle" letter-spacing="0" font-style="normal">REFACTOR</text><rect x="1060" y="165" width="500" height="440" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.2"/><text x="1090" y="217" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Most of it is not a close call</text><line x1="1090" y1="235" x2="1138" y2="235" stroke="#CDC8A5" stroke-width="2"/><text x="1090" y="271" font-family="IBM Plex Sans" font-size="14.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">On a typical estate the first question</text><text x="1090" y="295" font-family="IBM Plex Sans" font-size="14.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">alone settles a fifth of it. The arguments</text><text x="1090" y="319" font-family="IBM Plex Sans" font-size="14.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">are about the handful at the top right,</text><text x="1090" y="343" font-family="IBM Plex Sans" font-size="14.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">and those are the ones worth your time.</text><line x1="1090" y1="401" x2="1530" y2="401" stroke="#E1E1E1" stroke-width="1.2"/><text x="1090" y="445" font-family="IBM Plex Sans" font-size="15" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">The question we always get</text><text x="1090" y="475" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">“Can you just tell us what to switch off</text><text x="1090" y="497" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">first?” Yes. That list usually arrives</text><text x="1090" y="519" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">before the rest of the report, because it</text><text x="1090" y="541" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">is the part that pays for the exercise.</text><text x="60" y="732" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Every answer is recorded with its reason, including the ones where the answer is to do nothing.</text></svg>