<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720"><rect width="1600" height="720" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">DATA ENGINEERING</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">A migration is not done until it reconciles</text><line x1="60" y1="96" x2="1540" y2="96" stroke="#CDC8A5" stroke-width="2"/><rect x="60" y="160" width="340" height="190" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.3"/><text x="84" y="202" font-family="IBM Plex Sans" font-size="18" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Extracted</text><text x="84" y="226" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">from the legacy system</text><text x="84" y="288" font-family="Newsreader 16pt" font-size="34" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">412,886</text><text x="84" y="314" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">records</text><line x1="406" y1="255.0" x2="413.0" y2="255.0" stroke="#3F75A3" stroke-width="1.8" stroke-linecap="round"/><polygon points="420.0,255.0 413.0,251.4 413.0,258.6" fill="#3F75A3"/><rect x="426" y="160" width="340" height="190" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.3"/><text x="450" y="202" font-family="IBM Plex Sans" font-size="18" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Transformed</text><text x="450" y="226" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">mapped and cleansed</text><text x="450" y="288" font-family="Newsreader 16pt" font-size="34" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">412,886</text><text x="450" y="314" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">records</text><line x1="772" y1="255.0" x2="779.0" y2="255.0" stroke="#3F75A3" stroke-width="1.8" stroke-linecap="round"/><polygon points="786.0,255.0 779.0,251.4 779.0,258.6" fill="#3F75A3"/><rect x="792" y="160" width="340" height="190" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.3"/><text x="816" y="202" font-family="IBM Plex Sans" font-size="18" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Loaded</text><text x="816" y="226" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">into the target</text><text x="816" y="288" font-family="Newsreader 16pt" font-size="34" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">411,204</text><text x="816" y="314" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">records</text><line x1="1138" y1="255.0" x2="1145.0" y2="255.0" stroke="#3F75A3" stroke-width="1.8" stroke-linecap="round"/><polygon points="1152.0,255.0 1145.0,251.4 1145.0,258.6" fill="#3F75A3"/><rect x="1158" y="160" width="340" height="190" rx="3" fill="#F7F8FA" stroke="#3F75A3" stroke-width="1.8"/><text x="1182" y="202" font-family="IBM Plex Sans" font-size="18" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Rejected</text><text x="1182" y="226" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">listed, with the reason</text><text x="1182" y="288" font-family="Newsreader 16pt" font-size="34" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">1,682</text><text x="1182" y="314" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">records</text><rect x="60" y="396" width="1480" height="96" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.2"/><rect x="60" y="396" width="6" height="96" fill="#3F75A3"/><text x="92" y="434" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">411,204 + 1,682 = 412,886</text><text x="92" y="464" font-family="IBM Plex Sans" font-size="14.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Nothing vanished. Every rejected record is on a list with a named reason and an owner, and the list is worked until it is empty or the client signs it off.</text><rect x="60" y="520" width="1480" height="96" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="92" y="558" font-family="Newsreader 16pt" font-size="19" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">The question we are asked on every migration</text><text x="92" y="588" font-family="IBM Plex Sans" font-size="14.5" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">“Can you prove the new system holds everything the old one did?” This is the page we hand over. It is produced for every load, not just the final one.</text><text x="60" y="696" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="italic">Illustrative. Figures are a worked example, not a client result.</text></svg>