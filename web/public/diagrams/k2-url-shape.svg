<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="720" viewBox="0 0 1760 720"><rect width="1760" height="720" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">A DECISION THAT IS CHEAP NOW AND EXPENSIVE LATER</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Two URL shapes</text><line x1="60" y1="96" x2="1700" y2="96" stroke="#C1BC9C" stroke-width="2"/><rect x="60" y="140" width="800" height="430" rx="3" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.4"/><rect x="60" y="140" width="800" height="48" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="84" y="171" font-family="IBM Plex Sans" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="1.6" font-style="normal">NESTED UNDER THE PILLAR</text><text x="84" y="226" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Today</text><text x="84" y="256" font-family="IBM Plex Sans" font-size="14" fill="#3F75A3" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">/services/enterprise-platforms/sap/</text><text x="84" y="282" font-family="IBM Plex Sans" font-size="14" fill="#3F75A3" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">/services/enterprise-platforms/salesforce/</text><text x="84" y="314" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">The pillar is renamed, or Salesforce moves pillar</text><text x="84" y="344" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">/services/enterprise-platforms/sap/   → redirect</text><text x="84" y="370" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">/services/digital-data-ai/salesforce/ → redirect</text><text x="84" y="402" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Every child URL changes when the parent does. Redirects,</text><text x="84" y="424" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">lost rankings, dead links in old proposals and email</text><text x="84" y="446" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">signatures.</text><rect x="60" y="492" width="800" height="78" rx="3" fill="#94B8D0" stroke="#94B8D0" stroke-width="0"/><text x="84" y="522" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Breaks on every reorganisation. We will reorganise.</text><rect x="900" y="140" width="800" height="430" rx="3" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.4"/><rect x="900" y="140" width="800" height="48" rx="3" fill="#3F75A3" stroke="#3F75A3" stroke-width="0"/><text x="924" y="171" font-family="IBM Plex Sans" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="1.6" font-style="normal">FLAT UNDER SERVICES</text><text x="924" y="226" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Today</text><text x="924" y="256" font-family="IBM Plex Sans" font-size="14" fill="#3F75A3" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">/services/sap/</text><text x="924" y="282" font-family="IBM Plex Sans" font-size="14" fill="#3F75A3" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">/services/salesforce/</text><text x="924" y="314" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">The pillar is renamed, or Salesforce moves pillar</text><text x="924" y="344" font-family="IBM Plex Sans" font-size="14" fill="#3F75A3" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">/services/sap/          → unchanged</text><text x="924" y="370" font-family="IBM Plex Sans" font-size="14" fill="#3F75A3" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">/services/salesforce/   → unchanged</text><text x="924" y="402" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">The pillar is a grouping in the navigation and on the</text><text x="924" y="424" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">hub page, not a path segment. Regrouping is a navigation</text><text x="924" y="446" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">edit.</text><rect x="900" y="492" width="800" height="78" rx="3" fill="#A3CBE6" stroke="#A3CBE6" stroke-width="0"/><text x="924" y="522" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Survives every reorganisation. Costs nothing to adopt today.</text><rect x="60" y="608" width="1640" height="104" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="92" y="650" font-family="Newsreader 16pt" font-size="21" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Nothing is built yet, so this is free today.</text><text x="92" y="684" font-family="IBM Plex Sans" font-size="15" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">The same choice made after fifty pages are indexed costs a redirect map, a ranking dip and a year of stale links.</text></svg>