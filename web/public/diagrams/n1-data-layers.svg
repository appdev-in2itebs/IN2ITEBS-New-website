<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="840" viewBox="0 0 1760 840"><rect width="1760" height="840" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">ENTERPRISE DATA MANAGEMENT</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Three layers, bought separately or together</text><line x1="60" y1="96" x2="1700" y2="96" stroke="#C1BC9C" stroke-width="2"/><rect x="60" y="140" width="1640" height="168" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="1.2"/><text x="92" y="182" font-family="IBM Plex Sans" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="2.0" font-style="normal">ADVISE</text><text x="92" y="212.0" font-family="IBM Plex Sans" font-size="15" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Set direction before anything</text><text x="92" y="232.25" font-family="IBM Plex Sans" font-size="15" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">moves</text><text x="520" y="186" font-family="IBM Plex Sans" font-size="13.5" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Data strategy and target state</text><text x="1100" y="186" font-family="IBM Plex Sans" font-size="13.5" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Governance operating model</text><text x="520" y="216" font-family="IBM Plex Sans" font-size="13.5" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Retention and ILM policy</text><text x="1100" y="216" font-family="IBM Plex Sans" font-size="13.5" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— S/4HANA data-readiness and sizing</text><line x1="520" y1="258" x2="1668" y2="258" stroke="#3A4560" stroke-width="1.2"/><text x="520" y="282" font-family="IBM Plex Sans" font-size="9.5" fill="#A3CBE6" font-weight="600" text-anchor="start" letter-spacing="1.6" font-style="normal">HOW IT IS BOUGHT</text><text x="690" y="282" font-family="IBM Plex Sans" font-size="13" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Fixed-scope assessment, three to six weeks</text><rect x="60" y="318" width="1640" height="168" rx="3" fill="#3F75A3" stroke="#3F75A3" stroke-width="1.2"/><text x="92" y="360" font-family="IBM Plex Sans" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="2.0" font-style="normal">TRANSFORM</text><text x="92" y="390.0" font-family="IBM Plex Sans" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Execute it, wave by wave, with</text><text x="92" y="410.25" font-family="IBM Plex Sans" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">evidence at every gate</text><text x="520" y="364" font-family="IBM Plex Sans" font-size="13.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Profiling, cleansing, de-duplication</text><text x="1100" y="364" font-family="IBM Plex Sans" font-size="13.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Master data governance build</text><text x="520" y="394" font-family="IBM Plex Sans" font-size="13.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Migration — every transition pattern</text><text x="1100" y="394" font-family="IBM Plex Sans" font-size="13.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Archiving, ILM and decommissioning</text><line x1="520" y1="436" x2="1668" y2="436" stroke="#C1BC9C" stroke-width="1.2"/><text x="520" y="460" font-family="IBM Plex Sans" font-size="9.5" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="1.6" font-style="normal">HOW IT IS BOUGHT</text><text x="690" y="460" font-family="IBM Plex Sans" font-size="13" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Fixed price per wave, or per object, per cycle, per system retired</text><rect x="60" y="496" width="1640" height="168" rx="3" fill="#94B8D0" stroke="#94B8D0" stroke-width="1.2"/><text x="92" y="538" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="2.0" font-style="normal">OPERATE</text><text x="92" y="568.0" font-family="IBM Plex Sans" font-size="15" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Keep it trusted after the</text><text x="92" y="588.25" font-family="IBM Plex Sans" font-size="15" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">programme closes</text><text x="520" y="542" font-family="IBM Plex Sans" font-size="13.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Master data operations and upkeep</text><text x="1100" y="542" font-family="IBM Plex Sans" font-size="13.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Scheduled delta archiving</text><text x="520" y="572" font-family="IBM Plex Sans" font-size="13.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Replication and pipeline monitoring</text><text x="1100" y="572" font-family="IBM Plex Sans" font-size="13.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Compliance and audit evidence</text><line x1="520" y1="614" x2="1668" y2="614" stroke="#C1BC9C" stroke-width="1.2"/><text x="520" y="638" font-family="IBM Plex Sans" font-size="9.5" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="1.6" font-style="normal">HOW IT IS BOUGHT</text><text x="690" y="638" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Managed service against published SLAs, with a monthly scorecard</text><rect x="60" y="692" width="1640" height="100" rx="3" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.4"/><rect x="60" y="692" width="6" height="100" fill="#C1BC9C"/><text x="92" y="732" font-family="Newsreader 16pt" font-size="19" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Each layer stands alone. Most clients start at the top.</text><text x="92" y="762" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">A three-week assessment that concludes you should do nothing yet is a successful assessment, and it is priced as one.</text></svg>