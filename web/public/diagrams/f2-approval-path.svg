<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700"><rect width="1600" height="700" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">APPLIED AI</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">What the assistant does, and where it stops</text><line x1="60" y1="96" x2="1540" y2="96" stroke="#C1BC9C" stroke-width="2"/><rect x="60" y="150" width="784" height="352" rx="3" fill="#F7F8FA" stroke="#E1E6EE" stroke-width="1.3"/><text x="88" y="186" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">THE ASSISTANT MAY</text><circle cx="94" cy="221" r="3.5" fill="#3F75A3"/><text x="112" y="226" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Find the clause, the invoice or the precedent,</text><text x="112" y="247" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">and cite where it came from</text><circle cx="94" cy="287" r="3.5" fill="#3F75A3"/><text x="112" y="292" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Draft the note, the summary or the reply</text><circle cx="94" cy="331" r="3.5" fill="#3F75A3"/><text x="112" y="336" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Check a submission against the rule and flag</text><text x="112" y="357" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">what is missing</text><circle cx="94" cy="397" r="3.5" fill="#3F75A3"/><text x="112" y="402" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Reconcile two lists and show the differences</text><circle cx="94" cy="441" r="3.5" fill="#3F75A3"/><text x="112" y="446" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Complete a routine, reversible task it has</text><text x="112" y="467" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">been given a runbook for</text><line x1="870" y1="172" x2="870" y2="502" stroke="#121E3B" stroke-width="3"/><line x1="863" y1="176" x2="877" y2="176" stroke="#121E3B" stroke-width="1"/><line x1="863" y1="195" x2="877" y2="195" stroke="#121E3B" stroke-width="1"/><line x1="863" y1="214" x2="877" y2="214" stroke="#121E3B" stroke-width="1"/><line x1="863" y1="233" x2="877" y2="233" stroke="#121E3B" stroke-width="1"/><line x1="863" y1="252" x2="877" y2="252" stroke="#121E3B" stroke-width="1"/><line x1="863" y1="271" x2="877" y2="271" stroke="#121E3B" stroke-width="1"/><line x1="863" y1="290" x2="877" y2="290" stroke="#121E3B" stroke-width="1"/><line x1="863" y1="309" x2="877" y2="309" stroke="#121E3B" stroke-width="1"/><line x1="863" y1="328" x2="877" y2="328" stroke="#121E3B" stroke-width="1"/><line x1="863" y1="347" x2="877" y2="347" stroke="#121E3B" stroke-width="1"/><line x1="863" y1="366" x2="877" y2="366" stroke="#121E3B" stroke-width="1"/><line x1="863" y1="385" x2="877" y2="385" stroke="#121E3B" stroke-width="1"/><line x1="863" y1="404" x2="877" y2="404" stroke="#121E3B" stroke-width="1"/><line x1="863" y1="423" x2="877" y2="423" stroke="#121E3B" stroke-width="1"/><line x1="863" y1="442" x2="877" y2="442" stroke="#121E3B" stroke-width="1"/><line x1="863" y1="461" x2="877" y2="461" stroke="#121E3B" stroke-width="1"/><line x1="863" y1="480" x2="877" y2="480" stroke="#121E3B" stroke-width="1"/><line x1="863" y1="499" x2="877" y2="499" stroke="#121E3B" stroke-width="1"/><text x="870" y="160" font-family="IBM Plex Sans" font-size="11.5" fill="#121E3B" font-weight="600" text-anchor="middle" letter-spacing="2.0" font-style="normal">APPROVAL</text><rect x="896" y="150" width="644" height="352" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="924" y="186" font-family="IBM Plex Sans" font-size="12" fill="#94B8D0" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">A NAMED PERSON DECIDES</text><circle cx="930" cy="221" r="3.5" fill="#94B8D0"/><text x="948" y="226" font-family="IBM Plex Sans" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Anything that moves money, or commits to</text><text x="948" y="247" font-family="IBM Plex Sans" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">moving it</text><circle cx="930" cy="287" r="3.5" fill="#94B8D0"/><text x="948" y="292" font-family="IBM Plex Sans" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Anything that changes a master record</text><circle cx="930" cy="331" r="3.5" fill="#94B8D0"/><text x="948" y="336" font-family="IBM Plex Sans" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Anything that goes to a citizen, a</text><text x="948" y="357" font-family="IBM Plex Sans" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">supplier or a regulator</text><circle cx="930" cy="397" r="3.5" fill="#94B8D0"/><text x="948" y="402" font-family="IBM Plex Sans" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Anything that closes a case, a period or</text><text x="948" y="423" font-family="IBM Plex Sans" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">an account</text><circle cx="930" cy="463" r="3.5" fill="#94B8D0"/><text x="948" y="468" font-family="IBM Plex Sans" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Anything the assistant was not confident</text><text x="948" y="489" font-family="IBM Plex Sans" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">about</text><line x1="60" y1="545" x2="1540" y2="545" stroke="#E1E6EE" stroke-width="1.3"/><text x="60" y="587" font-family="Newsreader 16pt" font-size="22" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">The approval is the product.</text><text x="60" y="619" font-family="IBM Plex Sans" font-size="15" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Every step on the left is logged, attributable and reversible. Every item on the right carries a person's name against it. That is what makes the assistant deployable in a regulated process rather than a demonstration.</text></svg>