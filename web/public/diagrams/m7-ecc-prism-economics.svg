<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="660" viewBox="0 0 1760 660"><rect width="1760" height="660" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">THE COMMERCIAL CASE</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Where the money comes back from</text><line x1="60" y1="96" x2="1700" y2="96" stroke="#C1BC9C" stroke-width="2"/><rect x="60" y="140" width="395" height="312" rx="3" fill="#94B8D0" stroke="#94B8D0" stroke-width="1.3"/><text x="82" y="186.0" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Licences nobody uses</text><text x="82" y="262.0" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Dormant accounts, users</text><text x="82" y="281.5" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">classified above what they</text><text x="82" y="301.0" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">actually do, and indirect access</text><text x="82" y="320.5" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">found before SAP's own</text><text x="82" y="340.0" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">measurement finds it.</text><line x1="82" y1="396" x2="433" y2="396" stroke="#C1BC9C" stroke-width="1.5"/><text x="82" y="420.0" font-family="IBM Plex Sans" font-size="11.5" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Recurring, annual</text><rect x="475" y="140" width="395" height="312" rx="3" fill="#F7F8FA" stroke="#E1E6EE" stroke-width="1.3"/><text x="497" y="186.0" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Custom code nobody</text><text x="497" y="210.4" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">runs</text><text x="497" y="262.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Objects that have not executed</text><text x="497" y="281.5" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">in a year still cost you to</text><text x="497" y="301.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">maintain, to test and eventually</text><text x="497" y="320.5" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">to migrate. Retiring them is the</text><text x="497" y="340.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">cheapest work in the estate.</text><line x1="497" y1="396" x2="848" y2="396" stroke="#C1BC9C" stroke-width="1.5"/><text x="497" y="420.0" font-family="IBM Plex Sans" font-size="11.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Recurring, and again at</text><text x="497" y="436.675" font-family="IBM Plex Sans" font-size="11.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">migration</text><rect x="890" y="140" width="395" height="312" rx="3" fill="#F7F8FA" stroke="#E1E6EE" stroke-width="1.3"/><text x="912" y="186.0" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Data that should be</text><text x="912" y="210.4" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">archived</text><text x="912" y="262.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">A smaller database is faster,</text><text x="912" y="281.5" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">cheaper to host and cheaper to</text><text x="912" y="301.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">copy. The constraint is never</text><text x="912" y="320.5" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">technical — it is proving an</text><text x="912" y="340.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">auditor can still reach the</text><text x="912" y="359.5" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">record.</text><line x1="912" y1="396" x2="1263" y2="396" stroke="#C1BC9C" stroke-width="1.5"/><text x="912" y="420.0" font-family="IBM Plex Sans" font-size="11.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Infrastructure and performance</text><rect x="1305" y="140" width="395" height="312" rx="3" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.3"/><text x="1327" y="186.0" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Reporting on the wrong</text><text x="1327" y="210.4" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">platform</text><text x="1327" y="262.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Heavy reporting against the</text><text x="1327" y="281.5" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">transaction system is a</text><text x="1327" y="301.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">performance cost paid every day.</text><text x="1327" y="320.5" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Moving it off is usually</text><text x="1327" y="340.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">possible without buying a new</text><text x="1327" y="359.5" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">SAP licence.</text><line x1="1327" y1="396" x2="1678" y2="396" stroke="#C1BC9C" stroke-width="1.5"/><text x="1327" y="420.0" font-family="IBM Plex Sans" font-size="11.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Performance, and licence</text><text x="1327" y="436.675" font-family="IBM Plex Sans" font-size="11.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">avoidance</text><rect x="60" y="490" width="1640" height="100" rx="3" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.4"/><rect x="60" y="490" width="6" height="100" fill="#C1BC9C"/><text x="92" y="530" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">We do not sell what we recommend.</text><text x="92" y="562" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">No licence resale, no product commission, no analytics vendor we are paid to name. The findings are worth something precisely because nothing in them earns us a margin.</text></svg>