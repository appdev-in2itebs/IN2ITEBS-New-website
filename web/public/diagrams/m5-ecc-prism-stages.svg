<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="620" viewBox="0 0 1760 620"><rect width="1760" height="620" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">ECC PRISM</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Three stages. Each one sellable on its own.</text><line x1="60" y1="96" x2="1700" y2="96" stroke="#C1BC9C" stroke-width="2"/><rect x="60" y="140" width="529" height="400" rx="3" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.4"/><rect x="60" y="140" width="529" height="56" rx="3" fill="#121E3B" stroke="none" stroke-width="0"/><text x="82" y="176" font-family="IBM Plex Sans" font-size="11" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">STAGE ONE</text><text x="567" y="176" font-family="IBM Plex Sans" font-size="12" fill="#FFFFFF" font-weight="400" text-anchor="end" letter-spacing="0" font-style="normal">Six weeks</text><text x="82" y="232" font-family="Newsreader 16pt" font-size="23" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Assess</text><text x="82" y="262.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">We establish which maintenance door you are</text><text x="82" y="280.85" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">actually eligible for, what your custom code</text><text x="82" y="299.7" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">and database position allow, and what the real</text><text x="82" y="318.55" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">risk is in each year between now and your</text><text x="82" y="337.4" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">chosen date.</text><line x1="82" y1="362" x2="567" y2="362" stroke="#C1BC9C" stroke-width="1.4"/><text x="82" y="380" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Eligibility finding — 2027, 2030 or 2035</text><text x="82" y="406" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Custom code and Z-object inventory</text><text x="82" y="432" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Security and compliance exposure, year by</text><text x="94" y="451" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">year</text><text x="82" y="477" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— A costed comparison against migrating now</text><line x1="591" y1="168" x2="606.0" y2="168.0" stroke="#3F75A3" stroke-width="2" stroke-linecap="round"/><polygon points="613.0,168.0 606.0,164.4 606.0,171.6" fill="#3F75A3"/><rect x="615" y="140" width="529" height="400" rx="3" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.4"/><rect x="615" y="140" width="529" height="56" rx="3" fill="#3F75A3" stroke="none" stroke-width="0"/><text x="637" y="176" font-family="IBM Plex Sans" font-size="11" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">STAGE TWO</text><text x="1122" y="176" font-family="IBM Plex Sans" font-size="12" fill="#FFFFFF" font-weight="400" text-anchor="end" letter-spacing="0" font-style="normal">Scope-dependent</text><text x="637" y="232" font-family="Newsreader 16pt" font-size="23" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Remediate</text><text x="637" y="262.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">We get the estate into a state where it can</text><text x="637" y="280.85" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">run safely to the date you chose — closing the</text><text x="637" y="299.7" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">gaps the assessment found, without pretending</text><text x="637" y="318.55" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">the date is further away than it is.</text><line x1="637" y1="362" x2="1122" y2="362" stroke="#C1BC9C" stroke-width="1.4"/><text x="637" y="380" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Security and patch remediation</text><text x="637" y="406" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Custom code rationalisation</text><text x="637" y="432" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Interface and integration hardening</text><text x="637" y="458" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Documentation the next partner can actually</text><text x="649" y="477" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">use</text><line x1="1146" y1="168" x2="1161.0" y2="168.0" stroke="#3F75A3" stroke-width="2" stroke-linecap="round"/><polygon points="1168.0,168.0 1161.0,164.4 1161.0,171.6" fill="#3F75A3"/><rect x="1170" y="140" width="529" height="400" rx="3" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.4"/><rect x="1170" y="140" width="529" height="56" rx="3" fill="#94B8D0" stroke="none" stroke-width="0"/><text x="1192" y="176" font-family="IBM Plex Sans" font-size="11" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">STAGE THREE</text><text x="1677" y="176" font-family="IBM Plex Sans" font-size="12" fill="#121E3B" font-weight="400" text-anchor="end" letter-spacing="0" font-style="normal">Annual, renewable</text><text x="1192" y="232" font-family="Newsreader 16pt" font-size="23" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Run</text><text x="1192" y="262.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">We operate and support the estate to the</text><text x="1192" y="280.85" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">agreed date under the same SLA as any other</text><text x="1192" y="299.7" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">managed service, with the migration decision</text><text x="1192" y="318.55" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">reviewed every year rather than deferred</text><text x="1192" y="337.4" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">indefinitely.</text><line x1="1192" y1="362" x2="1677" y2="362" stroke="#C1BC9C" stroke-width="1.4"/><text x="1192" y="380" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Application and Basis support</text><text x="1192" y="406" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Statutory and regulatory updates</text><text x="1192" y="432" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Annual migration-readiness review</text><text x="1192" y="458" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Exit on three months' notice, documented</text></svg>