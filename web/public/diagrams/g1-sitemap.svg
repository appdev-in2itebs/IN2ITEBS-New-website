eight="400" text-anchor="start" letter-spacing="0" font-style="normal">Who we are</text><text x="1086" y="275" font-family="IBM Plex Sans" font-size="13.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Leadership</text><text x="1098" y="304" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— one page per leader</text><text x="1086" y="333" font-family="IBM Plex Sans" font-size="13.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Accreditations</text><text x="1086" y="362" font-family="IBM Plex Sans" font-size="13.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Partners</text><text x="1086" y="391" font-family="IBM Plex Sans" font-size="13.5" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Locations  4</text><line x1="1076" y1="226" x2="1312" y2="226" stroke="#C1BC9C" stroke-width="1.6"/><rect x="1330" y="160" width="236" height="52" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="1448.0" y="193" font-family="IBM Plex Sans" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle" letter-spacing="0" font-style="normal">Careers</text><text x="1340" y="246" font-family="IBM Plex Sans" font-size="13.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Life at In2IT</text><text x="1340" y="275" font-family="IBM Plex Sans" font-size="13.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Open roles</text><text x="1340" y="304" font-family="IBM Plex Sans" font-size="13.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Graduate programme</text><text x="1340" y="333" font-family="IBM Plex Sans" font-size="13.5" fill="#121E3B" font-weight="400" text-anch