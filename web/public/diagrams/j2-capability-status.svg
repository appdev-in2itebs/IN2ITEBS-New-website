amily="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Delivered as a subcontractor on a named programme</text><text x="82" y="546" font-family="IBM Plex Sans" font-size="15" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Salesforce</text><rect x="602" y="530" width="170" height="28" rx="2" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.2"/><text x="687.0" y="549" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="600" text-anchor="middle" letter-spacing="0" font-style="normal">Building</text><text x="832" y="546" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Practice in build. Ask us what is live today</text><rect x="60" y="570" width="1580" height="52" fill="#F7F8FA"/><text x="82" y="598" font-family="IBM Plex Sans" font-size="15" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Workday</text><rect x="602" y="582" width="170" height="28" rx="2" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.2"/><text x="687.0" y="601" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="600" text-anchor="middle" letter-spacing="0" font-style="normal">Building</text><text x="832" y="598" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Practice in build. Ask us what is live today</text><text x="82" y="650" font-family="IBM Plex Sans" font-size="15" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Applied AI in enterprise applications</text><rect x="602" y="634" width="170" height="28" rx="2" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.2"/><text x="687.0" y="653" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="600" text-anchor="middle" letter-spacing="0" font-style="normal">Building</text><text x="832" y="650" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Assistants and checking. Approval stays with a person</text><rect x="60" y="674" width="1580" height="52" fill="#F7F8FA"/><text x="82" y="702" font-family="IBM Plex Sans" font-size="15" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Managed network and security operations</text><rect x="602" y="686" width="170" height="28" rx="2" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.2"/><text x="687.0" y="705" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="600" text-anchor="middle" letter-spacing="0" font-style="normal">Building</text><text x="832" y="702" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Model being defined. Not yet offered</text><text x="82" y="754" font-family="IBM Plex Sans" font-size="15" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">OT and industrial control systems</text><rect x="602" y="738" width="170" height="28" rx="2" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.2"/><text x="687.0" y="757" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="600" text-anchor="middle" letter-spacing="0" font-style="normal">Ahead of us</text><text x="832" y="754" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">We do not do this today. We will say so</text><line x1="60" y1="818" x2="1640" y2="818" stroke="#E1E1E1" stroke-width="1.3"/><text x="60" y="854" font-family="IBM Plex Sans" font-size="14.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">A status moves to Delivered on a named client, in production, signed off, with a named person here accountable — never on the strength of a pursuit.</text><text x="60" y="880" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="italic">Specimen. Every line requires practice sign-off before publication.</text></svg>