<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="820" viewBox="0 0 1740 820"><rect width="1740" height="820" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">SAP ERP MAINTENANCE</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">It is a staircase, not a cliff</text><line x1="60" y1="96" x2="1680" y2="96" stroke="#C1BC9C" stroke-width="2"/><rect x="60" y="380" width="480" height="180" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="88" y="438" font-family="Newsreader 16pt" font-size="44" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">2027</text><text x="88" y="476" font-family="IBM Plex Sans" font-size="17" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Mainstream maintenance ends</text><text x="88" y="512" font-family="IBM Plex Sans" font-size="13.5" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Business Suite 7 core, end of year</text><rect x="576" y="294" width="480" height="266" fill="#94B8D0" stroke="#94B8D0" stroke-width="0"/><text x="604" y="352" font-family="Newsreader 16pt" font-size="44" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">2030</text><text x="604" y="390" font-family="IBM Plex Sans" font-size="17" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Extended maintenance ends</text><text x="604" y="426" font-family="IBM Plex Sans" font-size="13.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Available 2028-2030 at +2 percentage points</text><text x="604" y="446" font-family="IBM Plex Sans" font-size="13.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">on the maintenance basis</text><line x1="576" y1="574" x2="1056" y2="574" stroke="#E1E6EE" stroke-width="1.2"/><text x="578" y="600" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Almost half of remaining ECC customers are planning</text><text x="578" y="620" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">for this door, and accepting the surcharge</text><rect x="1092" y="208" width="480" height="352" fill="#3F75A3" stroke="#3F75A3" stroke-width="0"/><text x="1120" y="266" font-family="Newsreader 16pt" font-size="44" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">2035</text><text x="1120" y="304" font-family="IBM Plex Sans" font-size="17" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Private edition transition</text><text x="1120" y="328" font-family="IBM Plex Sans" font-size="17" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">option</text><text x="1120" y="364" font-family="IBM Plex Sans" font-size="13.5" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Extended to 31 Dec 2035 (SAP, 13 Oct 2026)</text><line x1="1092" y1="574" x2="1572" y2="574" stroke="#E1E6EE" stroke-width="1.2"/><text x="1094" y="600" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Gated: HANA only · 2 TB minimum system · migrate</text><text x="1094" y="620" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">before 31 Dec 2030 · 20% uplift for 2026 sign-ups</text><line x1="60" y1="560" x2="1680" y2="560" stroke="#121E3B" stroke-width="2.5"/><rect x="60" y="700" width="1620" height="96" rx="3" fill="#F7F8FA" stroke="#E1E6EE" stroke-width="1.2"/><rect x="60" y="700" width="6" height="96" fill="#3F75A3"/><text x="92" y="738" font-family="Newsreader 16pt" font-size="19" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">The question is not when the deadline is. It is which door you are eligible for.</text><text x="92" y="768" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">The 2 TB floor and the migrate-by-2030 condition disqualify a large part of the mid-market from the third door entirely. We tell you which one applies before anyone talks about a programme.</text></svg>