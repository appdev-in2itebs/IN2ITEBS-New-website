<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="838" viewBox="0 0 1760 838"><rect width="1760" height="838" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">WHERE WE ARE</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Four different things, often drawn as one</text><line x1="60" y1="96" x2="1700" y2="96" stroke="#CDC8A5" stroke-width="2"/><text x="60" y="126" font-family="IBM Plex Sans" font-size="14.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">An office is not a delivery centre and a legal entity is not either. Most footprint maps show one set of pins; these are four separate questions with four different answers.</text><text x="328" y="190" font-family="Newsreader 16pt" font-size="15.5" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">India</text><text x="604" y="190" font-family="Newsreader 16pt" font-size="15.5" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">South Africa</text><text x="880" y="190" font-family="Newsreader 16pt" font-size="15.5" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Kenya</text><text x="1156" y="190" font-family="Newsreader 16pt" font-size="15.5" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Singapore</text><text x="1432" y="190" font-family="Newsreader 16pt" font-size="15.5" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">United Arab Emirates</text><rect x="60" y="206" width="1640" height="92" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.1"/><text x="84" y="236" font-family="IBM Plex Sans" font-size="11.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.7" font-style="normal">STAFFED DELIVERY CENTRE</text><text x="84" y="258.0" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">People who build and run your</text><text x="84" y="274.2" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">systems. Visitable.</text><rect x="328" y="220" width="264" height="64" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="1.2"/><text x="342" y="246.0" font-family="IBM Plex Sans" font-size="12.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Bengaluru · Hyderabad · Delhi</text><text x="342" y="262.875" font-family="IBM Plex Sans" font-size="12.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">NCR · Bhubaneswar</text><rect x="604" y="220" width="264" height="64" rx="3" fill="none" stroke="#E1E1E1" stroke-width="1.4" stroke-dasharray="5 5"/><text x="736.0" y="257.0" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="middle" letter-spacing="0" font-style="italic">none</text><rect x="880" y="220" width="264" height="64" rx="3" fill="none" stroke="#E1E1E1" stroke-width="1.4" stroke-dasharray="5 5"/><text x="1012.0" y="257.0" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="middle" letter-spacing="0" font-style="italic">none</text><rect x="1156" y="220" width="264" height="64" rx="3" fill="none" stroke="#E1E1E1" stroke-width="1.4" stroke-dasharray="5 5"/><text x="1288.0" y="257.0" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="middle" letter-spacing="0" font-style="italic">none</text><rect x="1432" y="220" width="264" height="64" rx="3" fill="none" stroke="#E1E1E1" stroke-width="1.4" stroke-dasharray="5 5"/><text x="1564.0" y="257.0" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="middle" letter-spacing="0" font-style="italic">none</text><rect x="60" y="308" width="1640" height="92" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.1"/><text x="84" y="338" font-family="IBM Plex Sans" font-size="11.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.7" font-style="normal">OFFICE</text><text x="84" y="360.0" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">A place of business. Not a</text><text x="84" y="376.2" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">delivery centre.</text><rect x="328" y="322" width="264" height="64" rx="3" fill="#94B8D0" stroke="#94B8D0" stroke-width="1.2"/><text x="342" y="348.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Bengaluru (HQ and registered</text><text x="342" y="364.875" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">office)</text><rect x="604" y="322" width="264" height="64" rx="3" fill="#94B8D0" stroke="#94B8D0" stroke-width="1.2"/><text x="618" y="348.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Johannesburg</text><rect x="880" y="322" width="264" height="64" rx="3" fill="#94B8D0" stroke="#94B8D0" stroke-width="1.2"/><text x="894" y="348.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Nairobi</text><rect x="1156" y="322" width="264" height="64" rx="3" fill="#94B8D0" stroke="#94B8D0" stroke-width="1.2"/><text x="1170" y="348.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Singapore</text><rect x="1432" y="322" width="264" height="64" rx="3" fill="#94B8D0" stroke="#94B8D0" stroke-width="1.2"/><text x="1446" y="348.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Dubai</text><rect x="60" y="410" width="1640" height="92" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.1"/><text x="84" y="440" font-family="IBM Plex Sans" font-size="11.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.7" font-style="normal">LEGAL ENTITY</text><text x="84" y="462.0" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Who you contract with, and who</text><text x="84" y="478.2" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">carries the liability.</text><rect x="328" y="424" width="264" height="64" rx="3" fill="#94B8D0" stroke="#94B8D0" stroke-width="1.2"/><text x="342" y="450.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">In2IT Enterprise Business</text><text x="342" y="466.875" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Services Pvt Ltd</text><rect x="604" y="424" width="264" height="64" rx="3" fill="#94B8D0" stroke="#94B8D0" stroke-width="1.2"/><text x="618" y="450.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">In2IT Enterprise Business</text><text x="618" y="466.875" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Services (Pty) Ltd</text><rect x="880" y="424" width="264" height="64" rx="3" fill="#94B8D0" stroke="#94B8D0" stroke-width="1.2"/><text x="894" y="450.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">In2IT Enterprise Business</text><text x="894" y="466.875" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Services Kenya Limited</text><rect x="1156" y="424" width="264" height="64" rx="3" fill="#94B8D0" stroke="#94B8D0" stroke-width="1.2"/><text x="1170" y="450.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">In2IT Enterprise Business</text><text x="1170" y="466.875" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Services Pte Ltd</text><rect x="1432" y="424" width="264" height="64" rx="3" fill="#94B8D0" stroke="#94B8D0" stroke-width="1.2"/><text x="1446" y="450.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">In2IT EB Solutions L.L.C.</text><rect x="60" y="512" width="1640" height="150" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.1"/><text x="84" y="542" font-family="IBM Plex Sans" font-size="11.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.7" font-style="normal">DATA RESIDENCY</text><text x="84" y="564.0" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Where your data sits, and under</text><text x="84" y="580.2" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">which law.</text><rect x="328" y="526" width="264" height="122" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.2"/><text x="342" y="552.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">MeitY-compliant hosting for</text><text x="342" y="568.875" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">government workloads, data</text><text x="342" y="585.75" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">centre and DR inside Indian</text><text x="342" y="602.625" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">jurisdiction. DPDP Act and IT</text><text x="342" y="619.5" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Act 2000.</text><rect x="604" y="526" width="264" height="122" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.2"/><text x="618" y="552.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Aligned to the Protection of</text><text x="618" y="568.875" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Personal Information Act</text><text x="618" y="585.75" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">(POPIA).</text><rect x="880" y="526" width="264" height="122" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.2"/><text x="894" y="552.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Aligned to the Kenyan Data</text><text x="894" y="568.875" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Protection Act.</text><rect x="1156" y="526" width="264" height="122" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.2"/><text x="1170" y="552.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Aligned to the Personal Data</text><text x="1170" y="568.875" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Protection Act (PDPA).</text><rect x="1432" y="526" width="264" height="122" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.2"/><text x="1446" y="552.0" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Aligned to the UAE Personal</text><text x="1446" y="568.875" font-family="IBM Plex Sans" font-size="12.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Data Protection Law.</text><rect x="60" y="698" width="1640" height="96" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><rect x="60" y="698" width="6" height="96" fill="#CDC8A5"/><text x="94" y="736" font-family="Newsreader 16pt" font-size="20" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Four delivery centres, all of them in India.</text><text x="94" y="766" font-family="IBM Plex Sans" font-size="14" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Singapore, Dubai, Nairobi and Johannesburg are offices and legal entities. Real, and not the same thing — which is why they are on a different row.</text></svg>