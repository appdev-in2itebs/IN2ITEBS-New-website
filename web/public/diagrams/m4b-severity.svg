<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="760" viewBox="0 0 1760 760"><rect width="1760" height="760" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">MANAGED SERVICES</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">What happens when something breaks</text><line x1="60" y1="96" x2="1700" y2="96" stroke="#CDC8A5" stroke-width="2"/><text x="156" y="126" font-family="IBM Plex Sans" font-size="11" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal"></text><rect x="60" y="140" width="1640" height="38" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="1130" y="166" font-family="IBM Plex Sans" font-size="11" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">RESPONSE</text><text x="1400" y="166" font-family="IBM Plex Sans" font-size="11" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">RESOLUTION</text><rect x="60" y="186" width="1640" height="94" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="1.2"/><text x="92" y="238" font-family="Newsreader 16pt" font-size="28" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">S1</text><text x="92" y="266" font-family="IBM Plex Sans" font-size="14" fill="#A3CBE6" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Critical</text><text x="260" y="230.0" font-family="IBM Plex Sans" font-size="14" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Production down. Multiple modules unusable. A payroll</text><text x="260" y="250.3" font-family="IBM Plex Sans" font-size="14" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">run blocked, or a statutory deadline at risk.</text><text x="1130" y="238" font-family="Newsreader 16pt" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">30 minutes</text><text x="1400" y="238" font-family="Newsreader 16pt" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Same business day</text><rect x="60" y="290" width="1640" height="94" rx="3" fill="#3F75A3" stroke="#3F75A3" stroke-width="1.2"/><text x="92" y="342" font-family="Newsreader 16pt" font-size="28" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">S2</text><text x="92" y="370" font-family="IBM Plex Sans" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">High</text><text x="260" y="334.0" font-family="IBM Plex Sans" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">A major function unavailable. A workaround exists but</text><text x="260" y="354.3" font-family="IBM Plex Sans" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">the financial close is at risk.</text><text x="1130" y="342" font-family="Newsreader 16pt" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">2 hours</text><text x="1400" y="342" font-family="Newsreader 16pt" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">1 working day</text><rect x="60" y="394" width="1640" height="94" rx="3" fill="#94B8D0" stroke="#94B8D0" stroke-width="1.2"/><text x="92" y="446" font-family="Newsreader 16pt" font-size="28" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">S3</text><text x="92" y="474" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Medium</text><text x="260" y="438.0" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">A limited function affected. A few users. A non-critical</text><text x="260" y="458.3" font-family="IBM Plex Sans" font-size="14" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">report or screen.</text><text x="1130" y="446" font-family="Newsreader 16pt" font-size="16" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">8 hours</text><text x="1400" y="446" font-family="Newsreader 16pt" font-size="16" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">3 working days</text><rect x="60" y="498" width="1640" height="94" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.2"/><text x="92" y="550" font-family="Newsreader 16pt" font-size="28" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">S4</text><text x="92" y="578" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Low</text><text x="260" y="542.0" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Cosmetic issues, how-to questions, minor master-data</text><text x="260" y="562.3" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">edits, enhancement requests.</text><text x="1130" y="550" font-family="Newsreader 16pt" font-size="16" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">1 working day</text><text x="1400" y="550" font-family="Newsreader 16pt" font-size="16" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Backlog, reviewed monthly</text><rect x="60" y="620" width="1640" height="100" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.4"/><rect x="60" y="620" width="6" height="100" fill="#CDC8A5"/><text x="92" y="660" font-family="Newsreader 16pt" font-size="19" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">The clock stops only for reasons we both agree on.</text><text x="92" y="690" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Waiting on your approval, your access or your business input. Every pause is visible in the ticket. Miss the targets two months running and service credits apply.</text></svg>