<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="878" viewBox="0 0 1760 878"><rect width="1760" height="878" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">HOW WE PUBLISH NUMBERS</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">What a figure has to carry before it goes on this site</text><line x1="60" y1="96" x2="1700" y2="96" stroke="#CDC8A5" stroke-width="2"/><text x="60" y="126" font-family="IBM Plex Sans" font-size="14.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">A percentage without its baseline is not merely unproven. It is worth less than no number at all, because it costs the reader a unit of trust and gives their procurement team something to discount.</text><rect x="60" y="186" width="796" height="512" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.4"/><text x="88" y="226" font-family="IBM Plex Sans" font-size="11.5" fill="#5A6478" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">THE USUAL FORM</text><text x="88" y="298" font-family="Newsreader 16pt" font-size="62" fill="#5A6478" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">40%</text><text x="88" y="332" font-family="IBM Plex Sans" font-size="16" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">faster resolution</text><line x1="88" y1="366" x2="828" y2="366" stroke="#E1E1E1" stroke-width="1.4"/><text x="88" y="398" font-family="IBM Plex Sans" font-size="10.5" fill="#5A6478" font-weight="600" text-anchor="start" letter-spacing="1.5" font-style="normal">WHAT IT IS A NUMBER OF</text><text x="88" y="420" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="italic">— not stated</text><text x="88" y="474" font-family="IBM Plex Sans" font-size="10.5" fill="#5A6478" font-weight="600" text-anchor="start" letter-spacing="1.5" font-style="normal">THE PERIOD IT COVERS</text><text x="88" y="496" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="italic">— not stated</text><text x="88" y="550" font-family="IBM Plex Sans" font-size="10.5" fill="#5A6478" font-weight="600" text-anchor="start" letter-spacing="1.5" font-style="normal">WHO DID THE ARITHMETIC</text><text x="88" y="572" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="italic">— not stated</text><text x="88" y="626" font-family="IBM Plex Sans" font-size="10.5" fill="#5A6478" font-weight="600" text-anchor="start" letter-spacing="1.5" font-style="normal">WHAT IS NOT COUNTED</text><text x="88" y="648" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="italic">— not stated</text><text x="88" y="672" font-family="IBM Plex Sans" font-size="11.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Checked against two competitor case studies, November 2026.</text><rect x="904" y="186" width="796" height="512" rx="3" fill="#FFFFFF" stroke="#121E3B" stroke-width="1.8"/><text x="932" y="226" font-family="IBM Plex Sans" font-size="11.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">WHAT WE PUBLISH</text><text x="932" y="304" font-family="Newsreader 16pt" font-size="62" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">70–75%</text><text x="932" y="338" font-family="IBM Plex Sans" font-size="16" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">met by standard</text><line x1="932" y1="366" x2="1672" y2="366" stroke="#CDC8A5" stroke-width="1.6"/><text x="932" y="398" font-family="IBM Plex Sans" font-size="10.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.5" font-style="normal">WHAT IT IS A NUMBER OF</text><text x="932" y="420.0" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">More than 700 catalogued requirements across finance,</text><text x="932" y="436.9" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">quote-to-bill and fulfilment</text><text x="932" y="474" font-family="IBM Plex Sans" font-size="10.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.5" font-style="normal">THE PERIOD IT COVERS</text><text x="932" y="496.0" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">The fit-to-standard assessment, tested requirement by</text><text x="932" y="512.9" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">requirement</text><text x="932" y="550" font-family="IBM Plex Sans" font-size="10.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.5" font-style="normal">WHO DID THE ARITHMETIC</text><text x="932" y="572.0" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Measured by us, against a baseline recorded before the</text><text x="932" y="588.9" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">work started</text><text x="932" y="626" font-family="IBM Plex Sans" font-size="10.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.5" font-style="normal">WHAT IS NOT COUNTED</text><text x="932" y="648.0" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Requirements the client withdrew during the workshops</text><text x="932" y="672" font-family="IBM Plex Sans" font-size="11.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">From a 2026 S/4HANA Public Cloud assessment for a Belgian B2B ICT operator.</text><rect x="60" y="738" width="1640" height="96" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><rect x="60" y="738" width="6" height="96" fill="#CDC8A5"/><text x="94" y="776" font-family="Newsreader 16pt" font-size="20" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">A number that cannot fill all four slots does not appear as a number.</text><text x="94" y="806" font-family="IBM Plex Sans" font-size="14" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">It is a build failure here, not a style preference — which is why several of our case studies carry no percentage at all.</text></svg>