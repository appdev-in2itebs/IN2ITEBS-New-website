<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="820" viewBox="0 0 1760 820"><rect width="1760" height="820" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">SMART METER TO CASH</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">The revenue is lost at the hand-offs</text><line x1="60" y1="96" x2="1700" y2="96" stroke="#CDC8A5" stroke-width="2"/><rect x="60" y="160" width="292" height="124" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.3"/><text x="80" y="200" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.6" font-style="normal">01</text><text x="80" y="230" font-family="Newsreader 16pt" font-size="19" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Meter</text><text x="80" y="256" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Smart, conventional,</text><text x="80" y="274" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">bulk and DMA</text><line x1="358" y1="222" x2="382.0" y2="222.0" stroke="#94B8D0" stroke-width="2.4" stroke-linecap="round"/><polygon points="390.0,222.0 382.0,217.8 382.0,226.2" fill="#94B8D0"/><circle cx="374" cy="310" r="13" fill="#FFFFFF" stroke="#3F75A3" stroke-width="2"/><text x="374" y="316" font-family="IBM Plex Sans" font-size="15" fill="#3F75A3" font-weight="700" text-anchor="middle" letter-spacing="0" font-style="normal">!</text><line x1="374" y1="284" x2="374" y2="297" stroke="#3F75A3" stroke-width="1.6" stroke-dasharray="3 3"/><text x="374" y="352" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="middle" letter-spacing="0" font-style="normal">Meters installed but</text><text x="374" y="370" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="middle" letter-spacing="0" font-style="normal">not communicating</text><rect x="396" y="160" width="292" height="124" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.3"/><text x="416" y="200" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.6" font-style="normal">02</text><text x="416" y="230" font-family="Newsreader 16pt" font-size="19" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Meter data</text><text x="416" y="256" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Validation, estimation,</text><text x="416" y="274" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">exceptions</text><line x1="694" y1="222" x2="718.0" y2="222.0" stroke="#94B8D0" stroke-width="2.4" stroke-linecap="round"/><polygon points="726.0,222.0 718.0,217.8 718.0,226.2" fill="#94B8D0"/><circle cx="710" cy="310" r="13" fill="#FFFFFF" stroke="#3F75A3" stroke-width="2"/><text x="710" y="316" font-family="IBM Plex Sans" font-size="15" fill="#3F75A3" font-weight="700" text-anchor="middle" letter-spacing="0" font-style="normal">!</text><line x1="710" y1="284" x2="710" y2="297" stroke="#3F75A3" stroke-width="1.6" stroke-dasharray="3 3"/><text x="710" y="352" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="middle" letter-spacing="0" font-style="normal">Reads not reaching</text><text x="710" y="370" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="middle" letter-spacing="0" font-style="normal">billing on time</text><rect x="732" y="160" width="292" height="124" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.3"/><text x="752" y="200" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.6" font-style="normal">03</text><text x="752" y="230" font-family="Newsreader 16pt" font-size="19" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Billing</text><text x="752" y="256" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Tariffs, rating,</text><text x="752" y="274" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">bill print</text><line x1="1030" y1="222" x2="1054.0" y2="222.0" stroke="#94B8D0" stroke-width="2.4" stroke-linecap="round"/><polygon points="1062.0,222.0 1054.0,217.8 1054.0,226.2" fill="#94B8D0"/><circle cx="1046" cy="310" r="13" fill="#FFFFFF" stroke="#3F75A3" stroke-width="2"/><text x="1046" y="316" font-family="IBM Plex Sans" font-size="15" fill="#3F75A3" font-weight="700" text-anchor="middle" letter-spacing="0" font-style="normal">!</text><line x1="1046" y1="284" x2="1046" y2="297" stroke="#3F75A3" stroke-width="1.6" stroke-dasharray="3 3"/><text x="1046" y="352" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="middle" letter-spacing="0" font-style="normal">Customers on</text><text x="1046" y="370" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="middle" letter-spacing="0" font-style="normal">estimated bills</text><rect x="1068" y="160" width="292" height="124" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.3"/><text x="1088" y="200" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.6" font-style="normal">04</text><text x="1088" y="230" font-family="Newsreader 16pt" font-size="19" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Collections</text><text x="1088" y="256" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">FI-CA, mobile money,</text><text x="1088" y="274" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">dunning</text><line x1="1366" y1="222" x2="1390.0" y2="222.0" stroke="#94B8D0" stroke-width="2.4" stroke-linecap="round"/><polygon points="1398.0,222.0 1390.0,217.8 1390.0,226.2" fill="#94B8D0"/><circle cx="1382" cy="310" r="13" fill="#FFFFFF" stroke="#3F75A3" stroke-width="2"/><text x="1382" y="316" font-family="IBM Plex Sans" font-size="15" fill="#3F75A3" font-weight="700" text-anchor="middle" letter-spacing="0" font-style="normal">!</text><line x1="1382" y1="284" x2="1382" y2="297" stroke="#3F75A3" stroke-width="1.6" stroke-dasharray="3 3"/><text x="1382" y="352" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="middle" letter-spacing="0" font-style="normal">Manual follow-up,</text><text x="1382" y="370" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="middle" letter-spacing="0" font-style="normal">slow cash</text><rect x="1404" y="160" width="292" height="124" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.3"/><text x="1424" y="200" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.6" font-style="normal">05</text><text x="1424" y="230" font-family="Newsreader 16pt" font-size="19" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Revenue</text><text x="1424" y="256" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Ledger, regulator KPIs,</text><text x="1424" y="274" font-family="IBM Plex Sans" font-size="12" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">loss balance</text><rect x="60" y="420" width="1640" height="74" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="92" y="452" font-family="Newsreader 16pt" font-size="20" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Every one of those gaps sits between two suppliers.</text><text x="92" y="478" font-family="IBM Plex Sans" font-size="13.5" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">The meter vendor, the head-end, the MDM provider, the billing team and the collections agency each hold up their own SLA while the revenue sits in the space between them.</text><rect x="60" y="516" width="529" height="186" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.4"/><rect x="60" y="516" width="529" height="5" fill="#3F75A3"/><text x="82" y="560" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">01</text><text x="82" y="592" font-family="Newsreader 16pt" font-size="22" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Connect</text><text x="82" y="624.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Head-end, AMR and smart-meter integration · read</text><text x="82" y="642.85" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">validation and estimation rules · exception</text><text x="82" y="661.7" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">workflows · meter-health dashboards</text><rect x="615" y="516" width="529" height="186" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.4"/><rect x="615" y="516" width="529" height="5" fill="#3F75A3"/><text x="637" y="560" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">02</text><text x="637" y="592" font-family="Newsreader 16pt" font-size="22" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Bill</text><text x="637" y="624.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Utility Billing QPPS, our own pre-configured package</text><text x="637" y="642.85" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">· prepaid and postpaid on one platform · energy,</text><text x="637" y="661.7" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">water, sewerage and lifeline tariffs · bill-quality</text><text x="637" y="680.55" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">checks before release</text><rect x="1170" y="516" width="529" height="186" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.4"/><rect x="1170" y="516" width="529" height="5" fill="#3F75A3"/><text x="1192" y="560" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">03</text><text x="1192" y="592" font-family="Newsreader 16pt" font-size="22" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Collect</text><text x="1192" y="624.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">FI-CA, bank and mobile-money channels · dunning and</text><text x="1192" y="642.85" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">disconnection rules · prepaid token and top-up</text><text x="1192" y="661.7" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">integration · collection-propensity analytics</text><rect x="60" y="728" width="1640" height="70" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.2"/><rect x="60" y="728" width="6" height="70" fill="#CDC8A5"/><text x="92" y="758" font-family="Newsreader 16pt" font-size="18" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">One partner accountable for the whole flow.</text><text x="92" y="784" font-family="IBM Plex Sans" font-size="13.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Starts as a pilot on one circle, zone or division. Part of the fee can be tied to the KPIs it is meant to move.</text></svg>