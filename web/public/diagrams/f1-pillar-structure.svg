<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="640" viewBox="0 0 1620 640"><rect width="1620" height="640" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">DIGITAL, DATA &amp; AI</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Four services, one delivery engine</text><line x1="60" y1="96" x2="1560" y2="96" stroke="#CDC8A5" stroke-width="2"/><rect x="60" y="160" width="360" height="238" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="84" y="208" font-family="IBM Plex Sans" font-size="18" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Application</text><text x="84" y="234" font-family="IBM Plex Sans" font-size="18" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Engineering</text><line x1="84" y1="266" x2="122" y2="266" stroke="#CDC8A5" stroke-width="2"/><text x="84" y="298" font-family="IBM Plex Sans" font-size="14" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Build, integrate, modernise,</text><text x="84" y="319" font-family="IBM Plex Sans" font-size="14" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">assure and run the applications</text><text x="84" y="340" font-family="IBM Plex Sans" font-size="14" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">the business depends on.</text><rect x="440" y="160" width="360" height="238" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.3"/><text x="464" y="208" font-family="IBM Plex Sans" font-size="18" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Data Engineering and</text><text x="464" y="234" font-family="IBM Plex Sans" font-size="18" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Analytics</text><line x1="464" y1="266" x2="502" y2="266" stroke="#CDC8A5" stroke-width="2"/><text x="464" y="298" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Move it, reconcile it, and</text><text x="464" y="319" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">report it — so one figure means</text><text x="464" y="340" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">one thing.</text><rect x="820" y="160" width="360" height="238" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.3"/><text x="844" y="208" font-family="IBM Plex Sans" font-size="18" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Applied AI</text><line x1="844" y1="240" x2="882" y2="240" stroke="#CDC8A5" stroke-width="2"/><text x="844" y="272" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Assistants and agents that</text><text x="844" y="293" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">draft, retrieve and check.</text><text x="844" y="314" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">People still approve.</text><rect x="1200" y="160" width="360" height="238" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.3"/><text x="1224" y="208" font-family="IBM Plex Sans" font-size="18" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Managed Operations and</text><text x="1224" y="234" font-family="IBM Plex Sans" font-size="18" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Security</text><line x1="1224" y1="266" x2="1262" y2="266" stroke="#CDC8A5" stroke-width="2"/><text x="1224" y="298" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Keep the estate running and keep</text><text x="1224" y="319" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">it defensible.</text><rect x="60" y="434" width="1500" height="110" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.2"/><text x="92" y="476" font-family="Newsreader 16pt" font-size="19" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">One delivery engine underneath all four</text><text x="92" y="508" font-family="IBM Plex Sans" font-size="14.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">The same pipeline, the same nine test stages, the same change control, the same reporting — whichever of the four you buy, and however many of them you buy.</text><text x="60" y="610" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Integration, DevSecOps and cloud-native work are not separate services. They sit inside Application Engineering, where they are delivered.</text></svg>