<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="700" viewBox="0 0 1760 700"><rect width="1760" height="700" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">ACCELERATORS AND IP</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">What we bring that is ours</text><line x1="60" y1="96" x2="1700" y2="96" stroke="#CDC8A5" stroke-width="2"/><rect x="60" y="146" width="530" height="186" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.3"/><rect x="60" y="146" width="530" height="5" fill="#3F75A3"/><text x="82" y="186" font-family="IBM Plex Sans" font-size="10" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">OFFER</text><text x="82" y="222.0" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Utility Billing QPPS</text><text x="82" y="270.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Our own pre-configured utility billing</text><text x="82" y="288.85" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">package. Shortens the time to a first bill</text><text x="82" y="307.7" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">run.</text><rect x="614" y="146" width="530" height="186" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.3"/><rect x="614" y="146" width="530" height="5" fill="#3F75A3"/><text x="636" y="186" font-family="IBM Plex Sans" font-size="10" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">DELIVERY</text><text x="636" y="222.0" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Migration toolkit</text><text x="636" y="270.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Pre-built migration objects, validation rules</text><text x="636" y="288.85" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">and reconciliation reports for ECC and IS-U</text><text x="636" y="307.7" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">estates.</text><rect x="1168" y="146" width="530" height="186" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.3"/><rect x="1168" y="146" width="530" height="5" fill="#3F75A3"/><text x="1190" y="186" font-family="IBM Plex Sans" font-size="10" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">DESIGN</text><text x="1190" y="222.0" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Process library</text><text x="1190" y="270.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Fit-to-standard flows for power, water and</text><text x="1190" y="288.85" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">sewerage, ready for process mining.</text><rect x="60" y="354" width="530" height="186" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.3"/><rect x="60" y="354" width="530" height="5" fill="#94B8D0"/><text x="82" y="394" font-family="IBM Plex Sans" font-size="10" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">RUN</text><text x="82" y="430.0" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Test automation pack</text><text x="82" y="478.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Regression scripts for billing, contract</text><text x="82" y="496.85" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">accounting, asset and finance processes, built</text><text x="82" y="515.7" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">for quarterly cloud releases.</text><rect x="614" y="354" width="530" height="186" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.3"/><rect x="614" y="354" width="530" height="5" fill="#94B8D0"/><text x="636" y="394" font-family="IBM Plex Sans" font-size="10" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">RUN</text><text x="636" y="430.0" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">KPI dashboard pack</text><text x="636" y="478.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Analytics Cloud dashboards for loss, non-</text><text x="636" y="496.85" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">revenue water, billing and collection</text><text x="636" y="515.7" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">efficiency, asset availability.</text><rect x="1168" y="354" width="530" height="186" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.3"/><rect x="1168" y="354" width="530" height="5" fill="#94B8D0"/><text x="1190" y="394" font-family="IBM Plex Sans" font-size="10" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">DELIVERY</text><text x="1190" y="430.0" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Fiori app pack</text><text x="1190" y="478.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Repair tracking, material tracking and real-</text><text x="1190" y="496.85" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">time monitoring apps, first built for a state</text><text x="1190" y="515.7" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">distribution utility.</text><rect x="60" y="578" width="1640" height="92" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="92" y="616" font-family="Newsreader 16pt" font-size="20" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">An accelerator is a thing, not a word.</text><text x="92" y="646" font-family="IBM Plex Sans" font-size="14" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Each of these can be demonstrated. If we cannot show it to you in a working system, it does not belong on this list and we will take it off.</text></svg>