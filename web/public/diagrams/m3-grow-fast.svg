<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="620" viewBox="0 0 1760 620"><rect width="1760" height="620" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">GROW FAST</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">A fixed scope, a fixed date, a fixed price</text><line x1="60" y1="96" x2="1700" y2="96" stroke="#CDC8A5" stroke-width="2"/><line x1="60" y1="170" x2="1700" y2="170" stroke="#E1E1E1" stroke-width="3"/><circle cx="76" cy="170" r="9" fill="#3F75A3"/><text x="76" y="210" font-family="IBM Plex Sans" font-size="11" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.6" font-style="normal">WEEKS 1–2</text><text x="76" y="242" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Prepare</text><text x="76" y="272.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Access, project team, data</text><text x="76" y="290.85" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">templates issued</text><circle cx="404" cy="170" r="9" fill="#3F75A3"/><text x="404" y="210" font-family="IBM Plex Sans" font-size="11" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.6" font-style="normal">WEEKS 3–6</text><text x="404" y="242" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Explore</text><text x="404" y="272.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Fit-to-standard against SAP</text><text x="404" y="290.85" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Best Practices. Gaps are</text><text x="404" y="309.7" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">decisions, not change requests</text><circle cx="732" cy="170" r="9" fill="#3F75A3"/><text x="732" y="210" font-family="IBM Plex Sans" font-size="11" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.6" font-style="normal">WEEKS 7–12</text><text x="732" y="242" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Realize</text><text x="732" y="272.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Configuration, data load, two</text><text x="732" y="290.85" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">test cycles, user training</text><circle cx="1060" cy="170" r="9" fill="#3F75A3"/><text x="1060" y="210" font-family="IBM Plex Sans" font-size="11" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.6" font-style="normal">WEEKS 13–14</text><text x="1060" y="242" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Deploy</text><text x="1060" y="272.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Cutover rehearsal, go-live</text><circle cx="1388" cy="170" r="9" fill="#3F75A3"/><text x="1388" y="210" font-family="IBM Plex Sans" font-size="11" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.6" font-style="normal">WEEKS 15–16</text><text x="1388" y="242" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Run</text><text x="1388" y="272.0" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Hypercare, then handover to</text><text x="1388" y="290.85" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">managed service or to you</text><circle cx="1696" cy="170" r="9" fill="#121E3B"/><rect x="60" y="330" width="526" height="210" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.2"/><text x="82" y="370" font-family="Newsreader 16pt" font-size="18" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">What is fixed</text><text x="82" y="402" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Scope — the SAP Best Practice processes</text><text x="94" y="422" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">listed on this page</text><text x="82" y="450" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Duration — sixteen weeks from kick-off</text><text x="82" y="478" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Price — one figure, stated before you sign</text><rect x="616" y="330" width="526" height="210" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.2"/><text x="638" y="370" font-family="Newsreader 16pt" font-size="18" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">What is not included</text><text x="638" y="402" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Processes outside the listed scope</text><text x="638" y="430" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Custom development beyond the stated</text><text x="650" y="450" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">extension allowance</text><text x="638" y="478" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— Integration to systems not on the</text><text x="650" y="498" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">published list</text><rect x="1172" y="330" width="526" height="210" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="1.2"/><text x="1194" y="370" font-family="Newsreader 16pt" font-size="18" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">What happens if scope moves</text><text x="1194" y="402" font-family="IBM Plex Sans" font-size="13" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— It becomes a change request with its own</text><text x="1206" y="422" font-family="IBM Plex Sans" font-size="13" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">price and its own date.</text><text x="1194" y="450" font-family="IBM Plex Sans" font-size="13" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">— We will say so at the time, in writing,</text><text x="1206" y="470" font-family="IBM Plex Sans" font-size="13" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">before any work starts.</text></svg>