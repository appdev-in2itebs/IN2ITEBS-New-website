<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700"><rect width="1600" height="700" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">THE ARGUMENT</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Where the numbers stop agreeing</text><line x1="60" y1="96" x2="1540" y2="96" stroke="#CDC8A5" stroke-width="2"/><text x="60" y="176" font-family="IBM Plex Sans" font-size="17" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">What the plant recorded</text><text x="60" y="198" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Weighbridge app, 41 tickets</text><line x1="520" y1="170" x2="1320" y2="170" stroke="#E1E1E1" stroke-width="1.4"/><line x1="520" y1="170" x2="1243.8095238095239" y2="170" stroke="#121E3B" stroke-width="7" stroke-linecap="round"/><circle cx="1243.8095238095239" cy="170" r="8" fill="#121E3B"/><text x="1263.8095238095239" y="176" font-family="IBM Plex Sans" font-size="17" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">12,480 t</text><text x="60" y="272" font-family="IBM Plex Sans" font-size="17" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">What the interface passed</text><text x="60" y="294" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">3 batches failed, no alert</text><line x1="520" y1="266" x2="1320" y2="266" stroke="#E1E1E1" stroke-width="1.4"/><line x1="520" y1="266" x2="900.952380952381" y2="266" stroke="#3F75A3" stroke-width="7" stroke-linecap="round"/><circle cx="900.952380952381" cy="266" r="8" fill="#3F75A3"/><text x="920.952380952381" y="272" font-family="IBM Plex Sans" font-size="17" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">12,300 t</text><text x="60" y="368" font-family="IBM Plex Sans" font-size="17" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">What the ledger holds</text><text x="60" y="390" font-family="IBM Plex Sans" font-size="13" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Goods receipts posted to SAP</text><line x1="520" y1="362" x2="1320" y2="362" stroke="#E1E1E1" stroke-width="1.4"/><line x1="520" y1="362" x2="672.3809523809524" y2="362" stroke="#5A6478" stroke-width="7" stroke-linecap="round"/><circle cx="672.3809523809524" cy="362" r="8" fill="#5A6478"/><text x="692.3809523809524" y="368" font-family="IBM Plex Sans" font-size="17" fill="#5A6478" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">12,180 t</text><line x1="672.3809523809524" y1="148" x2="672.3809523809524" y2="414" stroke="#CDC8A5" stroke-width="1.4" stroke-dasharray="4 4"/><line x1="1243.8095238095239" y1="148" x2="1243.8095238095239" y2="414" stroke="#CDC8A5" stroke-width="1.4" stroke-dasharray="4 4"/><line x1="672.3809523809524" y1="404" x2="1235.8" y2="404.0" stroke="#121E3B" stroke-width="1.6" stroke-linecap="round"/><polygon points="1243.8,404.0 1235.8,399.8 1235.8,408.2" fill="#121E3B"/><line x1="1243.8095238095239" y1="404" x2="680.4" y2="404.0" stroke="#121E3B" stroke-width="1.6" stroke-linecap="round"/><polygon points="672.4,404.0 680.4,408.2 680.4,399.8" fill="#121E3B"/><rect x="900.0952380952381" y="389" width="116" height="30" fill="#FFFFFF"/><text x="958.0952380952381" y="410" font-family="Newsreader 16pt" font-size="19" fill="#121E3B" font-weight="600" text-anchor="middle" letter-spacing="0" font-style="normal">300 t</text><rect x="60" y="474" width="1480" height="122" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="92" y="520" font-family="Newsreader 16pt" font-size="22" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Three systems, one month, three different answers.</text><text x="92" y="556" font-family="IBM Plex Sans" font-size="15" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Nobody noticed for five weeks. An application that disagrees with the ledger is not a working application — and the first thing we do is find out by how much.</text><text x="60" y="674" font-family="IBM Plex Sans" font-size="12.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="italic">Illustrative. Figures are a worked example, not a client result.</text></svg>