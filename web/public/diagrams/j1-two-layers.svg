<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="720" viewBox="0 0 1660 720"><rect width="1660" height="720" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">THE POSITION</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Independent about the answer. Deep about the delivery.</text><line x1="60" y1="96" x2="1600" y2="96" stroke="#C1BC9C" stroke-width="2"/><rect x="60" y="160" width="1540" height="190" rx="3" fill="#FFFFFF" stroke="#121E3B" stroke-width="1.8"/><rect x="60" y="160" width="7" height="190" fill="#3F75A3"/><text x="94" y="208" font-family="Newsreader 16pt" font-size="22" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">What we advise</text><text x="94" y="240" font-family="IBM Plex Sans" font-size="11.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="2.0" font-style="normal">TECHNOLOGY AGNOSTIC</text><text x="94" y="278" font-family="IBM Plex Sans" font-size="15.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">We recommend what fits the problem, the budget and the people who have to run it — including</text><text x="94" y="302" font-family="IBM Plex Sans" font-size="15.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">when that is not a product we implement, and including when the answer is to do nothing. We will</text><text x="94" y="326" font-family="IBM Plex Sans" font-size="15.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">tell you when the recommendation costs us work.</text><line x1="830.0" y1="358" x2="830.0" y2="387.0" stroke="#94B8D0" stroke-width="2.2" stroke-linecap="round"/><polygon points="830.0,396.0 834.7,387.0 825.3,387.0" fill="#94B8D0"/><rect x="60" y="408" width="1540" height="250" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="94" y="458" font-family="Newsreader 16pt" font-size="22" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">What we deliver</text><text x="94" y="490" font-family="IBM Plex Sans" font-size="11.5" fill="#94B8D0" font-weight="600" text-anchor="start" letter-spacing="2.0" font-style="normal">DEPTH WHERE WE CLAIM IT</text><text x="94.0" y="536" font-family="IBM Plex Sans" font-size="16" fill="#94B8D0" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Deepest</text><line x1="94.0" y1="550" x2="128.0" y2="550" stroke="#C1BC9C" stroke-width="2"/><text x="94.0" y="578" font-family="IBM Plex Sans" font-size="13" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">SAP — S/4HANA, SuccessFactors,</text><text x="94.0" y="597" font-family="IBM Plex Sans" font-size="13" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">BTP and integration. Where the</text><text x="94.0" y="616" font-family="IBM Plex Sans" font-size="13" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">bench, the certifications and the</text><text x="94.0" y="635" font-family="IBM Plex Sans" font-size="13" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">delivery record actually are.</text><text x="484.5" y="536" font-family="IBM Plex Sans" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Delivered</text><line x1="484.5" y1="550" x2="518.5" y2="550" stroke="#C1BC9C" stroke-width="2"/><text x="484.5" y="578" font-family="IBM Plex Sans" font-size="13" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Custom application engineering,</text><text x="484.5" y="597" font-family="IBM Plex Sans" font-size="13" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">data platforms, open source,</text><text x="484.5" y="616" font-family="IBM Plex Sans" font-size="13" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">government workflow.</text><text x="875.0" y="536" font-family="IBM Plex Sans" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">With a partner</text><line x1="875.0" y1="550" x2="909.0" y2="550" stroke="#C1BC9C" stroke-width="2"/><text x="875.0" y="578" font-family="IBM Plex Sans" font-size="13" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Named, and named before you</text><text x="875.0" y="597" font-family="IBM Plex Sans" font-size="13" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">sign — not discovered during</text><text x="875.0" y="616" font-family="IBM Plex Sans" font-size="13" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">delivery.</text><text x="1265.5" y="536" font-family="IBM Plex Sans" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Ahead of us</text><line x1="1265.5" y1="550" x2="1299.5" y2="550" stroke="#C1BC9C" stroke-width="2"/><text x="1265.5" y="578" font-family="IBM Plex Sans" font-size="13" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Published, not hidden. If you need</text><text x="1265.5" y="597" font-family="IBM Plex Sans" font-size="13" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">it and we cannot do it, you should</text><text x="1265.5" y="616" font-family="IBM Plex Sans" font-size="13" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">know that from the website.</text><text x="60" y="690" font-family="IBM Plex Sans" font-size="15" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Breadth is a promise about how we advise. Depth is a claim about what we can build. The website must never let the first borrow credibility from the second.</text></svg>