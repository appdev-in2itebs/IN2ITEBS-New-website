<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" fill="#FFFFFF"/><rect x="0" y="0" width="1200" height="640" rx="3" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.4"/><rect x="0" y="0" width="1200" height="74" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="30" y="34" font-family="IBM Plex Sans" font-size="12" fill="#94B8D0" font-weight="600" text-anchor="start" letter-spacing="1.6" font-style="normal">REPORT SECTION 05</text><text x="30" y="56" font-family="Newsreader 16pt" font-size="21" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Licence position</text><text x="1170" y="46" font-family="IBM Plex Sans" font-size="12" fill="#A3CBE6" font-weight="400" text-anchor="end" letter-spacing="0" font-style="normal">ECC Prism sample output</text><text x="30" y="118" font-family="IBM Plex Sans" font-size="10.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.7" font-style="normal">WHAT THE PASS FOUND</text><rect x="30" y="150" width="548" height="74" rx="3" fill="#F7F8FA" stroke="#E1E6EE" stroke-width="1.2"/><text x="48" y="178.0" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Named users inactive for more than twelve</text><text x="48" y="194.9" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">months</text><text x="48" y="210" font-family="IBM Plex Sans" font-size="11.5" fill="#3F75A3" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">18% of the licensed population</text><rect x="30" y="234" width="548" height="74" rx="3" fill="#F7F8FA" stroke="#E1E6EE" stroke-width="1.2"/><text x="48" y="262.0" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Users classified above the role they actually</text><text x="48" y="278.9" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">perform</text><text x="48" y="294" font-family="IBM Plex Sans" font-size="11.5" fill="#3F75A3" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">22%, across three licence types</text><rect x="30" y="318" width="548" height="74" rx="3" fill="#F7F8FA" stroke="#E1E6EE" stroke-width="1.2"/><text x="48" y="346.0" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Shared user IDs in operational locations</text><text x="48" y="378" font-family="IBM Plex Sans" font-size="11.5" fill="#3F75A3" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Observed at multiple sites</text><rect x="30" y="402" width="548" height="74" rx="3" fill="#F7F8FA" stroke="#E1E6EE" stroke-width="1.2"/><text x="48" y="430.0" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Indirect access indicators on logistics</text><text x="48" y="446.9" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">interfaces</text><text x="48" y="462" font-family="IBM Plex Sans" font-size="11.5" fill="#3F75A3" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Two interfaces flagged for review</text><text x="618" y="118" font-family="IBM Plex Sans" font-size="10.5" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.7" font-style="normal">WHAT THE REPORT RECOMMENDS</text><rect x="618" y="150" width="552" height="74" rx="3" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.2"/><circle cx="650" cy="187" r="15" fill="#A3CBE6"/><text x="650" y="192" font-family="IBM Plex Sans" font-size="12" fill="#121E3B" font-weight="600" text-anchor="middle" letter-spacing="0" font-style="normal">a</text><text x="680" y="183.0" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Decommission or reassign inactive users</text><rect x="618" y="234" width="552" height="74" rx="3" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.2"/><circle cx="650" cy="271" r="15" fill="#A3CBE6"/><text x="650" y="276" font-family="IBM Plex Sans" font-size="12" fill="#121E3B" font-weight="600" text-anchor="middle" letter-spacing="0" font-style="normal">b</text><text x="680" y="267.0" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Reclassify users to lower-cost licence</text><text x="680" y="283.9" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">types</text><rect x="618" y="318" width="552" height="74" rx="3" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.2"/><circle cx="650" cy="355" r="15" fill="#A3CBE6"/><text x="650" y="360" font-family="IBM Plex Sans" font-size="12" fill="#121E3B" font-weight="600" text-anchor="middle" letter-spacing="0" font-style="normal">c</text><text x="680" y="351.0" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Eliminate shared IDs to reduce audit</text><text x="680" y="367.9" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">exposure</text><rect x="618" y="402" width="552" height="74" rx="3" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.2"/><circle cx="650" cy="439" r="15" fill="#A3CBE6"/><text x="650" y="444" font-family="IBM Plex Sans" font-size="12" fill="#121E3B" font-weight="600" text-anchor="middle" letter-spacing="0" font-style="normal">d</text><text x="680" y="435.0" font-family="IBM Plex Sans" font-size="13" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Run a LAW correction after the cleanup</text><rect x="30" y="498" width="1140" height="86" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="54" y="532" font-family="Newsreader 16pt" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Estimated impact</text><text x="54" y="560" font-family="IBM Plex Sans" font-size="12.5" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Annual licence cost reduction potential: high.   SAP audit exposure: medium, falling to low after remediation.</text><line x1="30" y1="594" x2="1170" y2="594" stroke="#C1BC9C" stroke-width="1.3"/><text x="30" y="614" font-family="IBM Plex Sans" font-size="11" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Illustrative figures from a sample report. Your own figures come from your own estate, and every one of them cites the system it came from.</text></svg>