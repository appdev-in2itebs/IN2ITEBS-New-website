<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="760" viewBox="0 0 1700 760"><rect width="1700" height="760" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">CREDENTIALS</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">What a tender actually reads</text><line x1="60" y1="96" x2="1640" y2="96" stroke="#CDC8A5" stroke-width="2"/><rect x="60" y="160" width="520" height="360" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="88" y="212" font-family="Newsreader 16pt" font-size="21" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Partnerships</text><line x1="88" y1="230" x2="136" y2="230" stroke="#CDC8A5" stroke-width="2"/><text x="88" y="262" font-family="IBM Plex Sans" font-size="14" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">One page per strategic partner.</text><circle cx="94" cy="301" r="3.5" fill="#94B8D0"/><text x="112" y="306" font-family="IBM Plex Sans" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">The designation we hold, named</text><circle cx="94" cy="342" r="3.5" fill="#94B8D0"/><text x="112" y="347" font-family="IBM Plex Sans" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">What it entitles a client to</text><circle cx="94" cy="383" r="3.5" fill="#94B8D0"/><text x="112" y="388" font-family="IBM Plex Sans" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">What it does not cover</text><circle cx="94" cy="424" r="3.5" fill="#94B8D0"/><text x="112" y="429" font-family="IBM Plex Sans" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Where we use a partner to deliver</text><rect x="610" y="160" width="520" height="360" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.3"/><text x="638" y="212" font-family="Newsreader 16pt" font-size="21" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Certifications</text><line x1="638" y1="230" x2="686" y2="230" stroke="#CDC8A5" stroke-width="2"/><text x="638" y="262" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Verifiable, not a badge strip.</text><circle cx="644" cy="301" r="3.5" fill="#3F75A3"/><text x="662" y="306" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">ISO 9001 · ISO/IEC 27001 · CMMI Level 3</text><circle cx="644" cy="342" r="3.5" fill="#3F75A3"/><text x="662" y="347" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Certificate number and issuing body</text><circle cx="644" cy="383" r="3.5" fill="#3F75A3"/><text x="662" y="388" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Scope: which entity, which sites</text><circle cx="644" cy="424" r="3.5" fill="#3F75A3"/><text x="662" y="429" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Validity dates, reviewed quarterly</text><rect x="1160" y="160" width="520" height="360" rx="3" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1.3"/><text x="1188" y="212" font-family="Newsreader 16pt" font-size="21" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Where we operate</text><line x1="1188" y1="230" x2="1236" y2="230" stroke="#CDC8A5" stroke-width="2"/><text x="1188" y="262" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Posture, per jurisdiction.</text><circle cx="1194" cy="301" r="3.5" fill="#3F75A3"/><text x="1212" y="306" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">The contracting entity in each market</text><circle cx="1194" cy="342" r="3.5" fill="#3F75A3"/><text x="1212" y="347" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Where data sits and is processed</text><circle cx="1194" cy="383" r="3.5" fill="#3F75A3"/><text x="1212" y="388" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Empanelment and class registration</text><circle cx="1194" cy="424" r="3.5" fill="#3F75A3"/><text x="1212" y="429" font-family="IBM Plex Sans" font-size="14.5" fill="#121E3B" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Who holds which service level</text><rect x="60" y="560" width="1580" height="110" rx="3" fill="#F7F8FA" stroke="#E1E1E1" stroke-width="1.2"/><text x="92" y="602" font-family="Newsreader 16pt" font-size="20" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Of six comparable firms, one states partner tiers consistently.</text><text x="92" y="636" font-family="IBM Plex Sans" font-size="14.5" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Between them they name more than two hundred partners. Most carry no designation at all. For a firm that competes on credential, that is open ground.</text></svg>