<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="700" viewBox="0 0 1760 700"><rect width="1760" height="700" fill="#FFFFFF"/><text x="60" y="44" font-family="IBM Plex Sans" font-size="12" fill="#3F75A3" font-weight="600" text-anchor="start" letter-spacing="1.9" font-style="normal">BUILT TO ABSORB GROWTH</text><text x="60" y="74" font-family="Newsreader 16pt" font-size="27" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Fixed containers, variable contents</text><line x1="60" y1="96" x2="1700" y2="96" stroke="#CDC8A5" stroke-width="2"/><rect x="60" y="140" width="1640" height="42" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="348" y="167" font-family="IBM Plex Sans" font-size="11.5" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">WHAT GROWS</text><text x="778" y="167" font-family="IBM Plex Sans" font-size="11.5" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">WHAT ABSORBS IT</text><text x="1288" y="167" font-family="IBM Plex Sans" font-size="11.5" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="1.8" font-style="normal">WHAT NEVER CHANGES</text><rect x="60" y="182" width="1640" height="112" fill="#F7F8FA"/><rect x="60" y="182" width="6" height="112" fill="#3F75A3"/><text x="78" y="230" font-family="Newsreader 16pt" font-size="21" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Vertical</text><text x="348" y="226" font-family="IBM Plex Sans" font-size="15" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">New industries and sub-</text><text x="348" y="248" font-family="IBM Plex Sans" font-size="15" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">sectors</text><text x="778" y="226" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">A row in the capability table first, with a status.</text><text x="778" y="248" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">A page only when there is proof to put on it.</text><text x="1288" y="226" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Nine industry slots in one grid that wraps.</text><text x="1288" y="248" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">The Industries hub and its template.</text><line x1="60" y1="294" x2="1700" y2="294" stroke="#E1E1E1" stroke-width="1.2"/><rect x="60" y="294" width="6" height="112" fill="#3F75A3"/><text x="78" y="342" font-family="Newsreader 16pt" font-size="21" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Horizontal</text><text x="348" y="338" font-family="IBM Plex Sans" font-size="15" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">New services, platforms</text><text x="348" y="360" font-family="IBM Plex Sans" font-size="15" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">and technologies</text><text x="778" y="338" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">A row in the capability table, moving Building →</text><text x="778" y="360" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">With a partner → Delivered. A page when it reaches</text><text x="778" y="382" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Delivered.</text><text x="1288" y="338" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">Three pillars. Seven navigation items. Six</text><text x="1288" y="360" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">templates.</text><line x1="60" y1="406" x2="1700" y2="406" stroke="#E1E1E1" stroke-width="1.2"/><rect x="60" y="406" width="1640" height="112" fill="#F7F8FA"/><rect x="60" y="406" width="6" height="112" fill="#3F75A3"/><text x="78" y="454" font-family="Newsreader 16pt" font-size="21" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Geographic</text><text x="348" y="450" font-family="IBM Plex Sans" font-size="15" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">New markets, entities and</text><text x="348" y="472" font-family="IBM Plex Sans" font-size="15" fill="#121E3B" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">delivery centres</text><text x="778" y="450" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">A market page from one template: entity, what we</text><text x="778" y="472" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">deliver, who leads it, data residency, proof.</text><text x="1288" y="450" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">The Markets section and its template. The</text><text x="1288" y="472" font-family="IBM Plex Sans" font-size="14" fill="#5A6478" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">geography tag on every case study.</text><rect x="60" y="556" width="1640" height="118" rx="3" fill="#121E3B" stroke="#121E3B" stroke-width="0"/><text x="92" y="602" font-family="Newsreader 16pt" font-size="22" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Build the slot. Do not build the page.</text><text x="92" y="638" font-family="IBM Plex Sans" font-size="15" fill="#A3CBE6" font-weight="400" text-anchor="start" letter-spacing="0" font-style="normal">An empty Oracle page is worse than no Oracle page. An Oracle row in the capability table, marked Building, is right — and it becomes a page the day there is a client to put on it.</text></svg>